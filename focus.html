<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cassian">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Focus Timer — Cassian's Super App</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(160deg,#FFF0F8 0%,#F0F4FF 50%,#F0FFF8 100%);min-height:100dvh;color:#1E1B4B;padding-bottom:calc(90px + env(safe-area-inset-bottom));overflow-x:hidden}
.page{max-width:500px;margin:0 auto;padding:28px 20px 20px;text-align:center}
.hdr{margin-bottom:24px}
.hdr-emoji{font-size:52px;display:block;margin-bottom:8px}
.hdr h1{font-size:30px;font-weight:900;color:#1E1B4B;margin-bottom:4px}
.hdr p{font-size:14px;font-weight:700;color:rgba(30,27,75,.45)}
.mode-pick{display:flex;gap:8px;background:white;border-radius:18px;padding:6px;box-shadow:0 2px 14px rgba(0,0,0,.08);margin-bottom:24px}
.mode-btn{flex:1;padding:10px 6px;border-radius:12px;border:none;background:transparent;color:rgba(30,27,75,.45);font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s}
.mode-btn.active{background:linear-gradient(135deg,#EC4899,#8B5CF6);color:white;box-shadow:0 3px 12px rgba(139,92,246,.35)}
.timer-wrap{position:relative;width:240px;height:240px;margin:0 auto 20px}
.timer-svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#EEF2FF;stroke-width:14}
.ring-progress{fill:none;stroke:#8B5CF6;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .8s ease,stroke .5s}
.timer-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-time{font-size:56px;font-weight:900;line-height:1;color:#1E1B4B;letter-spacing:-2px}
.timer-label{font-size:13px;font-weight:800;color:rgba(30,27,75,.4);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.timer-emoji{font-size:28px;margin-top:6px}
.activity-label{font-size:11px;font-weight:900;color:rgba(30,27,75,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.activity-input{width:100%;padding:13px 18px;background:white;border:2px solid rgba(99,102,241,.15);border-radius:16px;color:#1E1B4B;font-size:16px;font-family:'Nunito',sans-serif;font-weight:700;outline:none;transition:border-color .2s;text-align:center;margin-bottom:18px}
.activity-input:focus{border-color:#8B5CF6}
.activity-input::placeholder{color:rgba(30,27,75,.25)}
.dur-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.dur-chip{padding:9px 16px;border-radius:50px;border:2px solid rgba(99,102,241,.15);background:white;color:rgba(30,27,75,.6);font-size:14px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s}
.dur-chip.active{background:linear-gradient(135deg,#8B5CF6,#6366F1);color:white;border-color:transparent;box-shadow:0 3px 12px rgba(99,102,241,.35)}
.controls{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.btn-main{width:96px;height:96px;border-radius:50%;border:none;font-size:36px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif}
.btn-main:active{transform:scale(.92)}
.btn-start{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 8px 28px rgba(16,185,129,.35)}
.btn-pause{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 8px 28px rgba(245,158,11,.35)}
.btn-stop{width:64px;height:64px;font-size:26px;background:white;border:2px solid rgba(239,68,68,.2);color:#EF4444;box-shadow:0 4px 14px rgba(239,68,68,.1);align-self:center}
.session-msg{font-size:14px;font-weight:800;color:rgba(30,27,75,.5);min-height:22px;margin-bottom:16px}
.log-title{font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:rgba(30,27,75,.3);margin-bottom:10px}
.log-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.log-item{background:white;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:left}
.log-name{font-size:14px;font-weight:800;color:#1E1B4B}
.log-meta{font-size:11px;font-weight:700;color:rgba(30,27,75,.4);margin-top:2px}
.log-badge{font-size:11px;font-weight:900;padding:4px 10px;border-radius:50px;background:linear-gradient(135deg,#10B981,#059669);color:white}
.confetti-piece{position:fixed;top:-10px;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:9999;animation:confetti-fall 1.2s ease-in forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.app-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;align-items:center;padding:8px 4px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:2px solid #EEF2FF;z-index:1000;box-shadow:0 -4px 20px rgba(99,102,241,.06)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#9CA3AF;transition:all .2s;padding:5px 10px;border-radius:12px}
.nav-btn.active,.nav-btn:hover{color:#6366F1}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:9px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <span class="hdr-emoji">⏱️</span>
    <h1>Focus Timer</h1>
    <p>8–12 min focus, then break!</p>
  </div>

  <div class="mode-pick">
    <button class="mode-btn active" onclick="setMode('focus')">🧠 Focus</button>
    <button class="mode-btn" onclick="setMode('break')">🎮 Break</button>
    <button class="mode-btn" onclick="setMode('log')">📋 Log</button>
  </div>

  <!-- FOCUS -->
  <div id="focusMode">
    <div class="activity-label">What are you working on?</div>
    <input class="activity-input" id="activityInput" type="text" placeholder="Chess, Math, Robotics…" maxlength="40">
    <div class="activity-label">Pick your focus time</div>
    <div class="dur-chips">
      <button class="dur-chip" onclick="setDur(5)">5 min</button>
      <button class="dur-chip active" onclick="setDur(10)">10 min</button>
      <button class="dur-chip" onclick="setDur(12)">12 min</button>
      <button class="dur-chip" onclick="setDur(15)">15 min</button>
      <button class="dur-chip" onclick="setDur(20)">20 min</button>
    </div>
    <div class="timer-wrap">
      <svg class="timer-svg" width="240" height="240" viewBox="0 0 240 240">
        <circle class="ring-bg" cx="120" cy="120" r="106"/>
        <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="106"/>
      </svg>
      <div class="timer-inner">
        <div class="timer-time" id="timerTime">10:00</div>
        <div class="timer-label" id="timerLabel">Ready!</div>
        <div class="timer-emoji" id="timerEmoji">🚀</div>
      </div>
    </div>
    <div class="session-msg" id="sessionMsg">Pick what to focus on, then go! 💪</div>
    <div class="controls">
      <button class="btn-main btn-start" id="mainBtn" onclick="toggleTimer()">▶</button>
      <button class="btn-main btn-stop" onclick="stopTimer()">■</button>
    </div>
  </div>

  <!-- BREAK -->
  <div id="breakMode" style="display:none">
    <div class="activity-label">Break time!</div>
    <div class="dur-chips">
      <button class="dur-chip active" onclick="setBreakDur(3)">3 min</button>
      <button class="dur-chip" onclick="setBreakDur(5)">5 min</button>
      <button class="dur-chip" onclick="setBreakDur(10)">10 min</button>
    </div>
    <div class="timer-wrap">
      <svg class="timer-svg" width="240" height="240" viewBox="0 0 240 240">
        <circle class="ring-bg" cx="120" cy="120" r="106"/>
        <circle class="ring-progress" id="breakRing" cx="120" cy="120" r="106" style="stroke:#10B981"/>
      </svg>
      <div class="timer-inner">
        <div class="timer-time" id="breakTime">3:00</div>
        <div class="timer-label" id="breakLabel">Break!</div>
        <div class="timer-emoji">🎮</div>
      </div>
    </div>
    <div class="session-msg" id="breakMsg">You earned it! Rest your brain 🧠</div>
    <div class="controls">
      <button class="btn-main btn-start" id="breakBtn" onclick="toggleBreak()">▶</button>
      <button class="btn-main btn-stop" onclick="stopBreak()">■</button>
    </div>
  </div>

  <!-- LOG -->
  <div id="logMode" style="display:none">
    <div class="log-title">Your Focus Sessions</div>
    <div class="log-list" id="logList"></div>
  </div>
</div>

<nav class="app-nav">
  <a href="index.html" class="nav-btn"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
  <a href="numberblocks.html" class="nav-btn"><span class="nav-icon">🔢</span><span class="nav-label">Numbers</span></a>
  <a href="games.html" class="nav-btn"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  <a href="chess.html" class="nav-btn"><span class="nav-icon">♟️</span><span class="nav-label">Chess</span></a>
  <a href="cosmo.html" class="nav-btn"><span class="nav-icon">🤖</span><span class="nav-label">Cosmo</span></a>
</nav>

<script>
const CIRC=2*Math.PI*106;
let focusDur=10,breakDur=3,timeLeft=600,breakLeft=180;
let timer=null,breakTimer=null,running=false,breakRunning=false;
let sessions=JSON.parse(localStorage.getItem('focus_sessions_v2')||'[]');
const EMOJIS=['🚀','⚡','🔥','💪','🧠','🌟','🏆'];

function setMode(m){
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',['focus','break','log'][i]===m));
  document.getElementById('focusMode').style.display=m==='focus'?'':'none';
  document.getElementById('breakMode').style.display=m==='break'?'':'none';
  document.getElementById('logMode').style.display=m==='log'?'':'none';
  if(m==='log')renderLog();
}
function setDur(m){
  focusDur=m;if(!running){timeLeft=m*60;drawFocus();}
  document.querySelectorAll('#focusMode .dur-chip').forEach(b=>b.classList.toggle('active',parseInt(b.textContent)===m));
}
function setBreakDur(m){
  breakDur=m;if(!breakRunning){breakLeft=m*60;drawBreak();}
  document.querySelectorAll('#breakMode .dur-chip').forEach(b=>b.classList.toggle('active',parseInt(b.textContent)===m));
}
function fmt(s){const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function drawFocus(){
  const pct=timeLeft/(focusDur*60),off=CIRC*(1-pct);
  const ring=document.getElementById('ringProgress');
  ring.style.strokeDasharray=CIRC;ring.style.strokeDashoffset=off;
  ring.style.stroke=pct>.5?'#8B5CF6':pct>.2?'#F59E0B':'#EF4444';
  document.getElementById('timerTime').textContent=fmt(timeLeft);
  const ei=Math.min(Math.floor((1-pct)*EMOJIS.length),EMOJIS.length-1);
  document.getElementById('timerEmoji').textContent=EMOJIS[ei];
}
function drawBreak(){
  const pct=breakLeft/(breakDur*60),off=CIRC*(1-pct);
  const ring=document.getElementById('breakRing');
  ring.style.strokeDasharray=CIRC;ring.style.strokeDashoffset=off;
  document.getElementById('breakTime').textContent=fmt(breakLeft);
}
function toggleTimer(){running?pauseTimer():startTimer();}
function startTimer(){
  running=true;
  document.getElementById('mainBtn').textContent='⏸';
  document.getElementById('mainBtn').className='btn-main btn-pause';
  document.getElementById('timerLabel').textContent='Focusing!';
  document.getElementById('sessionMsg').textContent='🔥 You\'re doing amazing, Cassian!';
  timer=setInterval(()=>{
    if(timeLeft<=0){finishFocus();return;}
    timeLeft--;drawFocus();
    const e=focusDur*60-timeLeft;
    if(e===60)document.getElementById('sessionMsg').textContent='⚡ 1 minute in — keep going!';
    if(e===Math.floor(focusDur*30))document.getElementById('sessionMsg').textContent='💪 Halfway! You\'ve got this!';
    if(timeLeft===60)document.getElementById('sessionMsg').textContent='🌟 Almost done! 1 minute left!';
    if(timeLeft===10)document.getElementById('sessionMsg').textContent='🎉 10 seconds!! Final push!';
  },1000);
}
function pauseTimer(){
  running=false;clearInterval(timer);
  document.getElementById('mainBtn').textContent='▶';
  document.getElementById('mainBtn').className='btn-main btn-start';
  document.getElementById('timerLabel').textContent='Paused';
  document.getElementById('sessionMsg').textContent='⏸ Paused. Tap to continue!';
}
function stopTimer(){
  clearInterval(timer);running=false;timeLeft=focusDur*60;
  document.getElementById('mainBtn').textContent='▶';
  document.getElementById('mainBtn').className='btn-main btn-start';
  document.getElementById('timerLabel').textContent='Ready!';
  document.getElementById('timerEmoji').textContent='🚀';
  document.getElementById('sessionMsg').textContent='Pick what to focus on, then go! 💪';
  drawFocus();
}
function finishFocus(){
  clearInterval(timer);running=false;
  const activity=document.getElementById('activityInput').value||'Focus session';
  sessions.unshift({activity,mins:focusDur,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),date:new Date().toLocaleDateString()});
  if(sessions.length>20)sessions.pop();
  localStorage.setItem('focus_sessions_v2',JSON.stringify(sessions));
  confettiBurst();
  document.getElementById('timerLabel').textContent='DONE! 🎉';
  document.getElementById('timerEmoji').textContent='🏆';
  document.getElementById('sessionMsg').textContent=`🎊 ${focusDur} minutes! Incredible, Cassian!`;
  document.getElementById('mainBtn').textContent='▶';
  document.getElementById('mainBtn').className='btn-main btn-start';
  timeLeft=focusDur*60;drawFocus();
  setTimeout(()=>{if(confirm('Amazing session! 🎉 Take a break?'))setMode('break');},500);
}
function toggleBreak(){breakRunning?pauseBreak():startBreak();}
function startBreak(){
  breakRunning=true;
  document.getElementById('breakBtn').textContent='⏸';
  document.getElementById('breakBtn').className='btn-main btn-pause';
  document.getElementById('breakLabel').textContent='Breaking!';
  document.getElementById('breakMsg').textContent='🎮 Relax and have fun!';
  breakTimer=setInterval(()=>{if(breakLeft<=0){finishBreak();return;}breakLeft--;drawBreak();},1000);
}
function pauseBreak(){
  breakRunning=false;clearInterval(breakTimer);
  document.getElementById('breakBtn').textContent='▶';
  document.getElementById('breakBtn').className='btn-main btn-start';
  document.getElementById('breakLabel').textContent='Paused';
}
function stopBreak(){
  clearInterval(breakTimer);breakRunning=false;breakLeft=breakDur*60;
  document.getElementById('breakBtn').textContent='▶';
  document.getElementById('breakBtn').className='btn-main btn-start';
  document.getElementById('breakLabel').textContent='Break!';
  document.getElementById('breakMsg').textContent='You earned it! Rest your brain 🧠';
  drawBreak();
}
function finishBreak(){
  clearInterval(breakTimer);breakRunning=false;breakLeft=breakDur*60;
  document.getElementById('breakLabel').textContent='Break over!';
  document.getElementById('breakMsg').textContent='🚀 Ready to focus again?';
  document.getElementById('breakBtn').textContent='▶';
  document.getElementById('breakBtn').className='btn-main btn-start';
  drawBreak();
  setTimeout(()=>{if(confirm('Break done! 💪 Focus again?'))setMode('focus');},300);
}
function renderLog(){
  const list=document.getElementById('logList');
  if(!sessions.length){list.innerHTML='<div style="text-align:center;color:rgba(30,27,75,.35);font-size:14px;font-weight:700;padding:24px">No sessions yet! Start your first one 🚀</div>';return;}
  list.innerHTML=sessions.map(s=>`<div class="log-item"><div><div class="log-name">${s.activity}</div><div class="log-meta">${s.date} · ${s.time}</div></div><div class="log-badge">✓ ${s.mins}min</div></div>`).join('');
}
function confettiBurst(){
  const C=['#6366F1','#EC4899','#F59E0B','#10B981','#3B82F6','#EF4444'];
  for(let i=0;i<35;i++){setTimeout(()=>{const p=document.createElement('div');p.className='confetti-piece';p.style.cssText=`left:${15+Math.random()*70}%;background:${C[Math.floor(Math.random()*C.length)]};width:${6+Math.random()*9}px;height:${6+Math.random()*9}px;border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${.8+Math.random()*.6}s;animation-delay:${Math.random()*.3}s`;document.body.appendChild(p);setTimeout(()=>p.remove(),1400);},i*30);}
}
drawFocus();drawBreak();
const la=localStorage.getItem('last_focus_activity');
if(la)document.getElementById('activityInput').value=la;
document.getElementById('activityInput').addEventListener('input',e=>localStorage.setItem('last_focus_activity',e.target.value));
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
