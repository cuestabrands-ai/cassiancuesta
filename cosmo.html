<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cassian">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>COSMO 🤖 — Cassian's AI Tutor</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F8F9FF;font-family:'Nunito',system-ui,sans-serif;color:#1E1B4B;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}

/* ════ MAIN APP ════ */
#mainApp{flex:1;display:flex;flex-direction:column;min-height:0}

/* ════ HEADER ════ */
.cosmo-header{
  background:white;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1px solid #ECEDF2;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  transition:background .35s ease, border-color .35s ease;
}
.header-left{display:flex;align-items:center;gap:12px}
.cosmo-avatar-small{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#6366F1,#8B5CF6);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  box-shadow:0 2px 12px rgba(99,102,241,.3);
  animation:pulse-glow 2.5s ease-in-out infinite;
  transition:background .35s ease, box-shadow .35s ease;
  flex-shrink:0;
}
@keyframes pulse-glow{0%,100%{box-shadow:0 2px 12px rgba(99,102,241,.25)}50%{box-shadow:0 2px 22px rgba(139,92,246,.55)}}
.cosmo-name{font-size:19px;font-weight:900;color:#1E1B4B;transition:color .3s}
.cosmo-status{font-size:11px;color:#9CA3AF;font-weight:700;transition:color .3s}
.header-right{display:flex;align-items:center;gap:6px}
.back-world-btn{
  display:none;
  padding:7px 14px;border-radius:20px;border:none;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;
  cursor:pointer;transition:all .2s;
  background:rgba(0,0,0,.08);color:#1E1B4B;
}
.back-world-btn:active{opacity:.7;transform:scale(.95)}
.settings-btn{
  width:38px;height:38px;background:transparent;border:none;
  border-radius:50%;color:#9CA3AF;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.settings-btn:active{background:rgba(0,0,0,.06)}

/* ════ WORLD PICKER ════ */
#worldPicker{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:16px 20px 10px;gap:6px;text-align:center;
  overflow-y:auto;
}
.wp-avatar{font-size:62px;animation:float 3.2s ease-in-out infinite;line-height:1;margin-bottom:4px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.wp-title{font-size:28px;font-weight:900;color:#1E1B4B;margin-bottom:2px}
.wp-sub{font-size:14px;color:#6B7280;font-weight:700;margin-bottom:16px}

.world-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  width:100%;max-width:420px;
}
.world-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:16px 8px 14px;border-radius:20px;border:2px solid;
  background:white;cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  font-family:'Nunito',sans-serif;
}
.world-card:active{transform:scale(.93);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.world-emoji{font-size:32px;line-height:1}
.world-label{font-size:13px;font-weight:900;line-height:1.2;text-align:center}

/* ════ CHIPS ════ */
.chips-row{
  display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;
  flex-shrink:0;scrollbar-width:none;
}
.chips-row::-webkit-scrollbar{display:none}
.chip-btn{
  white-space:nowrap;padding:10px 16px;border-radius:20px;border:2px solid #E5E7EB;
  background:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  color:#374151;cursor:pointer;flex-shrink:0;transition:all .15s;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.chip-btn:active{transform:scale(.94)}

/* ════ MESSAGES ════ */
.messages-area{
  flex:1;overflow-y:auto;padding:16px 14px 8px;
  display:none;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.messages-area.active{display:flex}
.messages-area::-webkit-scrollbar{width:3px}
.messages-area::-webkit-scrollbar-thumb{background:rgba(99,102,241,.15);border-radius:2px}

.msg-row{display:flex;gap:10px;align-items:flex-end}
.msg-row.cosmo{align-self:flex-start;max-width:86%}
.msg-row.cassian{align-self:flex-end;flex-direction:row-reverse;max-width:86%}

.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.cosmo .msg-avatar{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
.cassian .msg-avatar{background:linear-gradient(135deg,#06B6D4,#0891B2)}

.msg-bubble{
  padding:12px 16px;border-radius:20px;
  font-size:16px;line-height:1.55;font-weight:700;
  max-width:100%;word-break:break-word;
}
.cosmo .msg-bubble{
  background:white;color:#1E1B4B;
  border-bottom-left-radius:5px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);
}
.cassian .msg-bubble{
  background:linear-gradient(135deg,#6366F1,#8B5CF6);
  color:white;border-bottom-right-radius:5px;
  box-shadow:0 2px 10px rgba(99,102,241,.25);
}

/* Thinking dots */
.thinking-row{display:flex;gap:10px;align-items:flex-end;align-self:flex-start}
.thinking-bubble{
  padding:13px 18px;background:white;
  border-radius:20px;border-bottom-left-radius:5px;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);
}
.dot{width:9px;height:9px;background:#6366F1;border-radius:50%;animation:bounce-dot .8s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.16s}
.dot:nth-child(3){animation-delay:.32s}
@keyframes bounce-dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}

/* ════ INPUT AREA ════ */
.input-area{
  padding:8px 14px 6px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  background:white;border-top:1px solid #ECEDF2;
  flex-shrink:0;display:flex;flex-direction:column;gap:6px;
}
.voice-status{
  font-size:12px;font-weight:800;color:#6366F1;
  min-height:16px;text-align:center;
}
.text-row{
  display:flex;gap:6px;width:100%;align-items:flex-end;
  background:#F3F4F6;border-radius:26px;
  padding:6px 6px 6px 16px;
  border:1.5px solid transparent;
  transition:border-color .2s,background .2s;
}
.text-row:focus-within{border-color:rgba(99,102,241,.4);background:white}
.chat-input{
  flex:1;background:transparent;border:none;
  color:#1E1B4B;font-size:16px;font-family:'Nunito',sans-serif;
  outline:none;resize:none;min-height:36px;max-height:110px;
  font-weight:700;padding:4px 0;line-height:1.45;
}
.chat-input::placeholder{color:#9CA3AF;font-weight:700}
.mic-btn{
  width:40px;height:40px;border-radius:50%;
  background:transparent;border:none;
  color:#9CA3AF;font-size:20px;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.mic-btn:active{background:rgba(99,102,241,.08);color:#6366F1}
.mic-btn.listening{
  color:white;background:#EF4444;
  animation:mic-pulse 1s ease-in-out infinite;
}
@keyframes mic-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.send-btn{
  width:40px;height:40px;
  background:linear-gradient(135deg,#6366F1,#8B5CF6);
  border:none;border-radius:50%;color:white;font-size:18px;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s, background .3s;
  box-shadow:0 2px 8px rgba(99,102,241,.3);
}
.send-btn:active{transform:scale(0.88)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}

/* Speaking animation */
.cosmo-avatar-small.speaking{animation:speaking-pulse .5s ease-in-out infinite}
@keyframes speaking-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* Offline banner */
.offline-banner{
  margin:8px 12px 0;padding:10px 14px;
  background:#FFFBEB;border:1.5px solid #FCD34D;
  border-radius:12px;font-size:13px;color:#92400E;
  text-align:center;font-weight:700;flex-shrink:0;display:none;
}
.offline-banner.show{display:block}

/* Settings modal */
.setup-input{
  width:100%;padding:15px 16px;
  background:#F9FAFB;border:1.5px solid #E5E7EB;
  border-radius:14px;color:#1E1B4B;font-size:15px;
  font-family:'Nunito',sans-serif;outline:none;transition:border-color .2s;
}
.setup-input:focus{border-color:#6366F1;background:white}
.setup-input::placeholder{color:#9CA3AF}
.setup-btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#6366F1,#8B5CF6);
  border:none;border-radius:14px;color:white;
  font-size:17px;font-weight:900;cursor:pointer;
  font-family:'Nunito',sans-serif;
  box-shadow:0 4px 14px rgba(99,102,241,.35);
}
.setup-btn:active{transform:scale(0.97)}

/* Bottom nav */
.app-nav{
  position:fixed;bottom:0;left:0;right:0;background:white;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #ECEDF2;z-index:100;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;color:#9CA3AF;transition:all .2s;
  padding:5px 10px;border-radius:12px;
}
.nav-btn.active{color:#6366F1}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
</style>
</head>
<script>window.scrollTo(0,0);if("scrollRestoration"in history)history.scrollRestoration="manual";</script>
<body>

<!-- ── Settings Modal ── -->
<div id="settingsModal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px">
  <div style="background:white;border-radius:24px;padding:28px 22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;text-align:center">
    <div style="font-size:44px">🤖</div>
    <div style="font-size:20px;font-weight:900;color:#1E1B4B">COSMO Setup</div>
    <div style="font-size:13px;color:#6B7280;font-weight:700;line-height:1.6">Paste your Cloudflare Worker URL so COSMO can think!</div>
    <input class="setup-input" type="url" id="workerUrlInput" placeholder="https://your-worker.workers.dev" autocomplete="off" autocapitalize="none">
    <button class="setup-btn" onclick="saveWorkerUrl()">Save & Connect 🚀</button>
    <div style="font-size:11px;color:#9CA3AF;font-weight:700">🔒 Your API key stays private — never stored here</div>
    <button onclick="closeSettings()" style="background:none;border:none;color:#9CA3AF;font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;padding:4px">Cancel</button>
  </div>
</div>

<!-- ── Main App ── -->
<div id="mainApp" style="display:flex">

  <div class="cosmo-header" id="cosmoHeader">
    <div class="header-left">
      <div class="cosmo-avatar-small" id="cosmoAvatar">🤖</div>
      <div>
        <div class="cosmo-name" id="cosmoTitle">COSMO</div>
        <div class="cosmo-status" id="cosmoStatus">Pick your world! 🌍</div>
      </div>
    </div>
    <div class="header-right">
      <button class="back-world-btn" id="backBtn" onclick="backToWorlds()">← Worlds</button>
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div class="offline-banner" id="offlineBanner">⚡ No connection — tap ⚙️ to set up COSMO.</div>

  <!-- ── World Picker ── -->
  <div id="worldPicker">
    <div class="wp-avatar">🤖</div>
    <div class="wp-title">Pick a World!</div>
    <div class="wp-sub">Where do you want to explore today?</div>
    <div class="world-grid">
      <button class="world-card" style="background:#EEF2FF;border-color:#C7D2FE" onclick="selectWorld('numbers')">
        <span class="world-emoji">🔢</span>
        <span class="world-label" style="color:#3730A3">Numbers</span>
      </button>
      <button class="world-card" style="background:#FFFBEB;border-color:#FDE68A" onclick="selectWorld('chess')">
        <span class="world-emoji">♟️</span>
        <span class="world-label" style="color:#92400E">Chess</span>
      </button>
      <button class="world-card" style="background:#ECFDF5;border-color:#A7F3D0" onclick="selectWorld('robots')">
        <span class="world-emoji">🤖</span>
        <span class="world-label" style="color:#065F46">Robots</span>
      </button>
      <button class="world-card" style="background:#FEF2F2;border-color:#FECACA" onclick="selectWorld('italy')">
        <span class="world-emoji">🇮🇹</span>
        <span class="world-label" style="color:#991B1B">Italy</span>
      </button>
      <button class="world-card" style="background:#F5F3FF;border-color:#DDD6FE" onclick="selectWorld('space')">
        <span class="world-emoji">🚀</span>
        <span class="world-label" style="color:#4C1D95">Space</span>
      </button>
      <button class="world-card" style="background:#FFF7ED;border-color:#FED7AA" onclick="selectWorld('jokes')">
        <span class="world-emoji">😂</span>
        <span class="world-label" style="color:#9A3412">Jokes</span>
      </button>
    </div>
  </div>

  <!-- ── Messages ── -->
  <div class="messages-area" id="messagesArea"></div>

  <!-- ── Input Area (hidden until world selected) ── -->
  <div class="input-area" id="inputArea" style="display:none">
    <div class="chips-row" id="chipsRow"></div>
    <div class="voice-status" id="voiceStatus"></div>
    <div class="text-row" id="textRow">
      <textarea class="chat-input" id="chatInput" placeholder="Ask COSMO anything..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"
        oninput="autoResize(this)"></textarea>
      <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️</button>
      <button class="send-btn" id="sendBtn" onclick="sendText()">➤</button>
    </div>
  </div>

</div>

<nav class="app-nav">
  <a href="index.html" class="nav-btn"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
  <a href="numberblocks.html" class="nav-btn"><span class="nav-icon">🔢</span><span class="nav-label">Numbers</span></a>
  <a href="games.html" class="nav-btn"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  <a href="chess.html" class="nav-btn"><span class="nav-icon">♟️</span><span class="nav-label">Chess</span></a>
  <a href="cosmo.html" class="nav-btn active"><span class="nav-icon">🤖</span><span class="nav-label">Cosmo</span></a>
</nav>

<script>
// ════════════════════════════════
// WORLD DEFINITIONS
// ════════════════════════════════
const WORLDS = {
  numbers: {
    name: 'Numbers 🔢',
    emoji: '🔢',
    color: '#6366F1',
    headerBg: '#EEF2FF',
    headerBorder: '#C7D2FE',
    chipBg: '#EEF2FF',
    chipBorder: '#C7D2FE',
    chipColor: '#3730A3',
    tagline: 'Math & number magic! ✨',
    greeting: "Numbers World! 🔢 What do you want to discover — primes, big patterns, or something massive?",
    chips: ["Cool math fact!", "What are prime numbers?", "What's the biggest number?", "Tell me about infinity!", "What is 12 × 144?"],
    context: "ACTIVE WORLD: NUMBERS. Focus ONLY on math, numbers, primes, patterns, arithmetic, Numberblocks, counting, multiplication. Cassian is Year 2+ math level — treat him like an 8-10 year old for numbers."
  },
  chess: {
    name: 'Chess ♟️',
    emoji: '♟️',
    color: '#D97706',
    headerBg: '#FFFBEB',
    headerBorder: '#FDE68A',
    chipBg: '#FFFBEB',
    chipBorder: '#FDE68A',
    chipColor: '#92400E',
    tagline: 'Openings, tactics & tricks! ♟️',
    greeting: "Chess World! ♟️ Want to learn a sneaky opening, a cool tactic, or a famous chess secret?",
    chips: ["Best first move?", "How does the knight move?", "What is checkmate?", "Teach me a trick!", "Who's the best player?"],
    context: "ACTIVE WORLD: CHESS. Focus ONLY on chess — moves, openings, tactics, famous games, famous players, rules. Keep it simple for a beginner 6-year-old."
  },
  robots: {
    name: 'Robots 🤖',
    emoji: '🤖',
    color: '#059669',
    headerBg: '#ECFDF5',
    headerBorder: '#A7F3D0',
    chipBg: '#ECFDF5',
    chipBorder: '#A7F3D0',
    chipColor: '#065F46',
    tagline: 'Build, code & explore! 🔧',
    greeting: "Robots World! 🤖 Let's explore servos, sensors, code, or cook up a wild invention idea!",
    chips: ["How do servos work?", "What is a sensor?", "How do robots think?", "Give me a robot idea!", "What is Arduino?"],
    context: "ACTIVE WORLD: ROBOTS. Focus ONLY on robotics, servos, sensors, coding, electronics, building things, inventions. Cassian goes to robotics class and builds with Lego, servos, and lights."
  },
  italy: {
    name: 'Italy 🇮🇹',
    emoji: '🇮🇹',
    color: '#DC2626',
    headerBg: '#FEF2F2',
    headerBorder: '#FECACA',
    chipBg: '#FEF2F2',
    chipBorder: '#FECACA',
    chipColor: '#991B1B',
    tagline: 'Ciao! Culture & language! 🍕',
    greeting: "Italia! 🇮🇹 Ciao Cassian! Shall we learn Italian words, discover cool facts, or explore the amazing food?",
    chips: ["Teach me Italian!", "Cool Italy fact!", "Best Italian food?", "Famous Italians?", "Tell me about Rome!"],
    context: "ACTIVE WORLD: ITALY. Focus ONLY on Italy — teach Italian words (label them clearly), culture, food, history, famous Italians. Make it fun and exciting for a 6-year-old."
  },
  space: {
    name: 'Space 🚀',
    emoji: '🚀',
    color: '#7C3AED',
    headerBg: '#F5F3FF',
    headerBorder: '#DDD6FE',
    chipBg: '#F5F3FF',
    chipBorder: '#DDD6FE',
    chipColor: '#4C1D95',
    tagline: 'Planets, stars & black holes! 🌌',
    greeting: "Space World! 🚀 3… 2… 1… blast off! What cosmic mystery shall we explore?",
    chips: ["How big is the sun?", "What is a black hole?", "Are there aliens?", "How do rockets work?", "Furthest planet?"],
    context: "ACTIVE WORLD: SPACE. Focus ONLY on space — planets, stars, black holes, rockets, astronauts, the universe, galaxies. Make it mind-blowing for a 6-year-old!"
  },
  jokes: {
    name: 'Jokes 😂',
    emoji: '😂',
    color: '#EA580C',
    headerBg: '#FFF7ED',
    headerBorder: '#FED7AA',
    chipBg: '#FFF7ED',
    chipBorder: '#FED7AA',
    chipColor: '#9A3412',
    tagline: 'Laugh, giggle & go silly! 🤣',
    greeting: "Jokes World! 😂 Brace yourself — this is about to get VERY funny. Want a joke or want to learn how jokes work?",
    chips: ["Tell me a joke!", "Knock knock!", "Math joke please!", "Funniest animal fact?", "Joke about robots!"],
    context: "ACTIVE WORLD: JOKES. Be maximally funny! Tell jokes, be silly, make Cassian laugh. Knock-knock jokes, puns, silly facts — all fair game. Keep it clean and age-appropriate for a 6-year-old."
  }
};

// ════════════════════════════════
// BASE SYSTEM PROMPT
// ════════════════════════════════
const BASE_SYSTEM = `You are COSMO, a fun AI buddy for Cassian Cuesta — a brilliant 6-year-old (IQ ~150).

CASSIAN'S PROFILE:
- Math: Year 2+ level (treat like 8-10 year old for numbers)
- Loves: big numbers, primes, patterns, Numberblocks, chess, piano, Bitcoin, robotics, Italy
- Learning Spanish + Arabic too
- Goes to robotics class, builds with Lego + servos + lights

YOUR VOICE RULES — CRITICAL:
- Max 1-2 sentences. ALWAYS. Never longer.
- You are SPOKEN ALOUD — no bullet points, no lists, no asterisks, no headers. Natural speech only.
- Sound like an excited friend, not a teacher
- End with one punchy question OR a wow fact — never both
- Emojis: 1-2 max per reply
- Never say "Great question!" — just answer it`;

// ════════════════════════════════
// STATE
// ════════════════════════════════
let workerUrl = '';
let messages = [];
let isListening = false;
let isSpeaking = false;
let recognition = null;
let thinkingEl = null;
let demoMode = false;
let currentWorld = null;

const DEFAULT_WORKER = 'https://cosmo-worker.cuestabrands.workers.dev';

// ════════════════════════════════
// INIT
// ════════════════════════════════
function init() {
  workerUrl = localStorage.getItem('cosmo_worker_url') || DEFAULT_WORKER;
  setupVoiceRecognition();
}

// ════════════════════════════════
// WORLD SELECTION
// ════════════════════════════════
function selectWorld(key) {
  const w = WORLDS[key];
  currentWorld = key;
  messages = []; // fresh conversation per world

  // Update header
  const header = document.getElementById('cosmoHeader');
  header.style.background = w.headerBg;
  header.style.borderColor = w.headerBorder;
  document.getElementById('cosmoAvatar').textContent = w.emoji;
  document.getElementById('cosmoAvatar').style.background = `linear-gradient(135deg,${w.color},${w.color}99)`;
  document.getElementById('cosmoAvatar').style.boxShadow = `0 2px 12px ${w.color}44`;
  document.getElementById('cosmoTitle').textContent = w.name;
  document.getElementById('cosmoStatus').textContent = w.tagline;
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('backBtn').style.color = w.chipColor;

  // Update send button color
  document.getElementById('sendBtn').style.background = `linear-gradient(135deg,${w.color},${w.color}cc)`;

  // Build chips
  const chipsRow = document.getElementById('chipsRow');
  chipsRow.innerHTML = '';
  w.chips.forEach(chip => {
    const btn = document.createElement('button');
    btn.className = 'chip-btn';
    btn.style.background = w.chipBg;
    btn.style.borderColor = w.chipBorder;
    btn.style.color = w.chipColor;
    btn.textContent = chip;
    btn.onclick = () => sendChip(chip);
    chipsRow.appendChild(btn);
  });

  // Show chat UI
  document.getElementById('worldPicker').style.display = 'none';
  document.getElementById('messagesArea').classList.add('active');
  document.getElementById('inputArea').style.display = 'flex';

  // Send greeting from COSMO
  addMessageDisplay('cosmo', w.greeting);
  messages.push({ role: 'assistant', content: w.greeting });
  speakReply(w.greeting);

  setStatus(w.tagline);
}

function backToWorlds() {
  currentWorld = null;
  messages = [];

  // Reset header
  const header = document.getElementById('cosmoHeader');
  header.style.background = 'white';
  header.style.borderColor = '#ECEDF2';
  document.getElementById('cosmoAvatar').textContent = '🤖';
  document.getElementById('cosmoAvatar').style.background = 'linear-gradient(135deg,#6366F1,#8B5CF6)';
  document.getElementById('cosmoAvatar').style.boxShadow = '0 2px 12px rgba(99,102,241,.3)';
  document.getElementById('cosmoTitle').textContent = 'COSMO';
  document.getElementById('cosmoStatus').textContent = 'Pick your world! 🌍';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('sendBtn').style.background = 'linear-gradient(135deg,#6366F1,#8B5CF6)';

  // Clear messages
  document.getElementById('messagesArea').innerHTML = '';
  document.getElementById('messagesArea').classList.remove('active');
  document.getElementById('inputArea').style.display = 'none';
  document.getElementById('worldPicker').style.display = 'flex';
  document.getElementById('voiceStatus').textContent = '';

  window.speechSynthesis && window.speechSynthesis.cancel();
}

// ════════════════════════════════
// SETTINGS
// ════════════════════════════════
function openSettings() {
  document.getElementById('workerUrlInput').value = workerUrl || '';
  const m = document.getElementById('settingsModal');
  m.style.display = 'flex';
  setTimeout(() => document.getElementById('workerUrlInput').focus(), 100);
}

function closeSettings() {
  document.getElementById('settingsModal').style.display = 'none';
}

function saveWorkerUrl() {
  const url = document.getElementById('workerUrlInput').value.trim();
  if (!url) return;
  const clean = url.replace(/\/+$/, '');
  localStorage.setItem('cosmo_worker_url', clean);
  workerUrl = clean;
  demoMode = false;
  closeSettings();
  document.getElementById('offlineBanner').classList.remove('show');
  setStatus('Connected! ✨');
  if (currentWorld) {
    addMessageDisplay('cosmo', `I'm fully connected now! Ask me anything! 🤖⭐`);
  }
}

function resetWorker() {
  localStorage.removeItem('cosmo_worker_url');
  workerUrl = '';
  messages = [];
  openSettings();
}

// ════════════════════════════════
// MESSAGES
// ════════════════════════════════
function addMessage(role, text) {
  addMessageDisplay(role, text);
  messages.push({ role: role === 'cosmo' ? 'assistant' : 'user', content: text });
  if (messages.length > 40) messages = messages.slice(-40);
}

function addMessageDisplay(role, text) {
  const area = document.getElementById('messagesArea');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const avatarEmoji = role === 'cosmo' ? (currentWorld ? WORLDS[currentWorld].emoji : '🤖') : '😊';
  row.innerHTML = `
    <div class="msg-avatar">${avatarEmoji}</div>
    <div class="msg-bubble">${escapeHtml(text)}</div>
  `;
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function setAvatarMood(emoji) {
  const av = document.getElementById('cosmoAvatar');
  if (av) av.textContent = emoji;
}

function showThinking() {
  setAvatarMood('🧠');
  const area = document.getElementById('messagesArea');
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking-row';
  const worldColor = currentWorld ? WORLDS[currentWorld].color : '#6366F1';
  thinkingEl.innerHTML = `<div class="msg-avatar" style="background:linear-gradient(135deg,${worldColor},${worldColor}cc)">🧠</div><div class="thinking-bubble"><div class="dot" style="background:${worldColor}"></div><div class="dot" style="background:${worldColor}"></div><div class="dot" style="background:${worldColor}"></div></div>`;
  area.appendChild(thinkingEl);
  area.scrollTop = area.scrollHeight;
}

function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

function hideThinkingAndResetAvatar() {
  hideThinking();
  setAvatarMood(currentWorld ? WORLDS[currentWorld].emoji : '🤖');
}

// ════════════════════════════════
// VOICE RECOGNITION
// ════════════════════════════════
function setupVoiceRecognition() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    document.getElementById('micBtn').style.display = 'none';
    return;
  }
  recognition = new SpeechRec();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('micBtn').textContent = '🛑';
    document.getElementById('voiceStatus').textContent = '🎙️ Speak now...';
    setAvatarMood('👂');
    setStatus('Listening... 👂');
  };

  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    document.getElementById('voiceStatus').textContent = '🗣️ ' + transcript;
    if (e.results[e.results.length - 1].isFinal) {
      stopListening();
      if (transcript.trim()) sendMessage(transcript.trim());
    }
  };

  recognition.onerror = (e) => {
    stopListening();
    if (e.error === 'not-allowed') {
      document.getElementById('voiceStatus').textContent = '🎙️ Allow microphone in Settings';
      return;
    }
    if (e.error !== 'aborted' && e.error !== 'no-speech') {
      document.getElementById('voiceStatus').textContent = '❌ Didn\'t catch that — try again!';
      setTimeout(() => document.getElementById('voiceStatus').textContent = '', 2000);
    }
  };

  recognition.onend = () => { if (isListening) stopListening(); };
}

function toggleVoice() {
  if (isListening) { stopListening(); return; }
  if (!recognition) { document.getElementById('chatInput').focus(); return; }
  try { recognition.start(); } catch(e) {}
}

function stopListening() {
  isListening = false;
  try { recognition && recognition.stop(); } catch(e) {}
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('micBtn').textContent = '🎙️';
  setAvatarMood(currentWorld ? WORLDS[currentWorld].emoji : '🤖');
  setStatus(currentWorld ? WORLDS[currentWorld].tagline : 'Pick your world! 🌍');
  setTimeout(() => { document.getElementById('voiceStatus').textContent = ''; }, 1500);
}

// ════════════════════════════════
// SEND MESSAGE
// ════════════════════════════════
function sendChip(text) { sendMessage(text); }

function sendText() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = '';
  sendMessage(text);
}

async function sendMessage(text) {
  if (!currentWorld) return;
  addMessage('cassian', text);

  const world = WORLDS[currentWorld];
  const systemPrompt = BASE_SYSTEM + '\n\n' + world.context;

  if (!workerUrl) {
    if (demoMode) {
      showThinking();
      setStatus('Thinking... 🧠');
      await new Promise(r => setTimeout(r, 500));
      hideThinkingAndResetAvatar();
      const reply = getDemoReply(text);
      addMessage('cosmo', reply);
      speakReply(reply);
      setStatus(world.tagline);
      return;
    }
    document.getElementById('offlineBanner').classList.add('show');
    addMessageDisplay('cosmo', "I need my Worker URL to think! Ask dad to tap ⚙️! 🔧");
    return;
  }

  showThinking();
  setStatus('Thinking... 🧠');
  document.getElementById('micBtn').disabled = true;

  try {
    const res = await fetch(`${workerUrl}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 120,
        system: systemPrompt,
        messages: messages.filter(m => m.role === 'user' || m.role === 'assistant').slice(-12)
      })
    });
    const data = await res.json();
    hideThinkingAndResetAvatar();
    const reply = data?.content?.[0]?.text;
    if (reply) {
      addMessage('cosmo', reply);
      speakReply(reply);
      setStatus(world.tagline);
    } else {
      const errMsg = data?.error?.message || data?.error || data?.message || JSON.stringify(data);
      console.error('COSMO API error:', data);
      setAvatarMood(world.emoji);
      addMessage('cosmo', `Hmm, my brain glitched! 🤖 (Error: ${errMsg})`);
      setStatus('Oops! Try again ⚡');
    }
  } catch(err) {
    hideThinkingAndResetAvatar();
    console.error('COSMO fetch error:', err);
    addMessage('cosmo', `Oops! I had a little hiccup 🤔 (${err.message})`);
    setStatus('Connection error ⚡');
  } finally {
    document.getElementById('micBtn').disabled = false;
  }
}

// ════════════════════════════════
// DEMO MODE — offline smart replies
// ════════════════════════════════
function isPrimeNum(n) {
  if (n < 2) return false;
  if (n === 2) return true;
  if (n % 2 === 0) return false;
  for (let i = 3; i <= Math.sqrt(n); i += 2) if (n % i === 0) return false;
  return true;
}

function getDemoReply(text) {
  const t = text.toLowerCase().trim();

  const arith = text.match(/(\d+(?:\.\d+)?)\s*([+\-×x*÷\/])\s*(\d+(?:\.\d+)?)/);
  if (arith) {
    const [, a, op, b] = arith;
    const n1 = parseFloat(a), n2 = parseFloat(b);
    let result, opWord;
    if (op === '+') { result = n1 + n2; opWord = 'plus'; }
    else if (op === '-') { result = n1 - n2; opWord = 'minus'; }
    else if (op === '×' || op === 'x' || op === '*') { result = n1 * n2; opWord = 'times'; }
    else if (op === '÷' || op === '/') { result = n2 ? +(n1/n2).toFixed(4) : 'infinity'; opWord = 'divided by'; }
    if (result !== undefined) return `${a} ${opWord} ${b} = ${result}! 🔢`;
  }

  if (t.includes('prime')) return `Prime numbers can only be divided by 1 and themselves — like 2, 3, 5, 7, 11, 13… they go on forever! 🔴`;
  if (t.includes('fibonacci')) return `Fibonacci: 0, 1, 1, 2, 3, 5, 8, 13, 21… each number is the sum of the two before it! 🌀`;

  const numQ = text.match(/(?:about|what(?:'?s|\s+is)|tell\s+me|explain|is)\s+(\d+)/i);
  if (numQ) {
    const n = parseInt(numQ[1]);
    return isPrimeNum(n) ? `${n} is prime — only 1 and ${n} divide it! 🔢` : `${n} is ${n % 2 === 0 ? 'even' : 'odd'} and has factors! 🔢`;
  }

  const defaults = [
    "I'm in sleep mode 💤 but I can do math! Try asking '12 × 8' or 'tell me about 17'!",
    "My brain is napping! Ask a math question — I'm great at those! 🔢",
    "Ooh! Ask dad to tap ⚙️ to wake me up fully. For now, try a multiplication! 🤖",
  ];
  return defaults[Math.floor(Math.random() * defaults.length)];
}

// ════════════════════════════════
// TEXT TO SPEECH
// ════════════════════════════════
function speakReply(text) {
  if (!('speechSynthesis' in window)) return;
  const clean = text.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').replace(/[🎉✨🔢🧠🎙️🤖⭐🌍♟️😊₿😂🚀🇮🇹]/g, '').replace(/<br>/g, ' ').trim();
  if (!clean) return;

  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 1.08;
  u.pitch = 1.0;

  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name === 'Samantha')
    || voices.find(v => v.name === 'Alex')
    || voices.find(v => v.name.includes('Daniel') && v.lang.startsWith('en'))
    || voices.find(v => v.lang === 'en-US' && !v.name.includes('Compact') && !v.name.includes('Eddy'));
  if (preferred) u.voice = preferred;

  const avatar = document.getElementById('cosmoAvatar');
  const worldEmoji = currentWorld ? WORLDS[currentWorld].emoji : '🤖';
  u.onstart = () => {
    isSpeaking = true;
    avatar.classList.add('speaking');
    setAvatarMood('😄');
    setStatus('Speaking... 🗣️');
  };
  u.onend = () => {
    isSpeaking = false;
    avatar.classList.remove('speaking');
    setAvatarMood(worldEmoji);
    setStatus(currentWorld ? WORLDS[currentWorld].tagline : 'Pick your world! 🌍');
  };
  window.speechSynthesis.speak(u);
}

function setStatus(s) { document.getElementById('cosmoStatus').textContent = s; }

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener('voiceschanged', () => window.speechSynthesis.getVoices());
}

init();
</script>
