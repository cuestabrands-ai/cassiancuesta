<head>

  <style>
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #070710;
      color: #E8E4FF;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      padding-bottom: 90px;
    }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 80% 40% at 50% -10%, rgba(240,163,163,0.05) 0%, transparent 70%); pointer-events:none; z-index:0; }

    /* ── Header ── */
    .library-header {
      text-align: center;
      padding: 28px 20px 12px;
    }
    .library-header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      font-family: 'Playfair Display', Georgia, serif;
      background: linear-gradient(135deg, #F0A3A3, #e08080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .library-header p {
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* ── Discovered counter ── */
    .discovery-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 20px 16px;
    }
    .discovery-text {
      font-size: 1rem;
      font-weight: 700;
      color: #F0A3A3;
    }
    .discovery-progress {
      flex: 1;
      max-width: 220px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .discovery-fill {
      height: 100%;
      background: linear-gradient(90deg, #F0A3A3, #e08080);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* ── Category pills ── */
    .filter-scroll {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }

    .pill {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .pill:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
    .pill.active {
      background: #F0A3A3;
      border-color: #F0A3A3;
      color: #070710;
    }

    /* ── Card grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      padding: 0 16px;
    }

    /* ── Flip card ── */
    .card {
      aspect-ratio: 3/4;
      perspective: 900px;
      cursor: pointer;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .card-front {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }
    .card-front:hover {
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.09);
    }
    .card.flipped .card-front { border-color: rgba(255,255,255,0.08); }

    .card-emoji {
      font-size: 2.8rem;
      line-height: 1;
    }
    .card-category {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.55;
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.3;
      color: rgba(255,255,255,0.92);
    }
    .card-tap-hint {
      font-size: 0.6rem;
      opacity: 0.35;
      margin-top: 4px;
    }

    /* Seen badge */
    .seen-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F0A3A3;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card.seen .seen-dot { opacity: 1; }

    /* ── Card back colors per category ── */
    .card-back {
      transform: rotateY(180deg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .card-back.cat-math     { background: linear-gradient(135deg, #003d4d 0%, #005566 100%); border-color: #00d4ff44; }
    .card-back.cat-chess    { background: linear-gradient(135deg, #3d2e00 0%, #5c4500 100%); border-color: #f59e0b44; }
    .card-back.cat-bitcoin  { background: linear-gradient(135deg, #3d1a00 0%, #5c2800 100%); border-color: #f97316aa; }
    .card-back.cat-music    { background: linear-gradient(135deg, #3d0026 0%, #5c003a 100%); border-color: #ec489944; }
    .card-back.cat-robotics { background: linear-gradient(135deg, #1a0040 0%, #280060 100%); border-color: #8b5cf644; }
    .card-back.cat-languages{ background: linear-gradient(135deg, #003d1a 0%, #005528 100%); border-color: #22c55e44; }
    .card-back.cat-space    { background: linear-gradient(135deg, #000d3d 0%, #001466 100%); border-color: #6366f144; }
    .card-back.cat-bonus    { background: linear-gradient(135deg, #1a1a3d 0%, #2a2a5c 100%); border-color: #a78bfa44; }

    .back-number {
      font-size: 0.6rem;
      font-weight: 800;
      opacity: 0.4;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .back-emoji {
      font-size: 1.6rem;
      line-height: 1;
    }
    .back-fact {
      font-size: 0.75rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.92);
      font-weight: 500;
    }
    .back-tap-hint {
      font-size: 0.6rem;
      opacity: 0.35;
      text-align: right;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.35);
      font-size: 0.9rem;
      display: none;
    }

    /* ── Bottom nav ── */
    .app-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: rgba(7,7,16,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 8px 0 env(safe-area-inset-bottom, 8px);
      z-index: 100;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: rgba(255,255,255,0.45);
      font-size: 0.65rem;
      font-weight: 600;
      transition: color 0.2s;
      padding: 4px 0;
    }
    .nav-btn.active { color: #F0A3A3; }
    .nav-btn:hover { color: #F0A3A3; }
    .nav-icon { font-size: 1.35rem; line-height: 1; }
    .nav-label { letter-spacing: 0.02em; }

    @media (min-width: 600px) {
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; padding: 0 24px; }
      .library-header h1 { font-size: 2.2rem; }
    }
    @media (min-width: 900px) {
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }

  </style>

  <script>
  // ─────────────────────────────────────────────
  //  FACTS DATABASE — 100 cards
  // ─────────────────────────────────────────────
  const FACTS = [
    // ── MATH (20 facts) ──────────────────────────
    {
      id: 1, cat: 'math', catLabel: '🔢 Math', emoji: '🔢',
      title: '1 Is Not Prime',
      fact: 'The number 1 is NOT a prime number — mathematicians decided this on purpose! If 1 were prime, the Fundamental Theorem of Arithmetic would break: every number has exactly one prime factorization, and letting 1 be prime would create infinitely many.'
    },
    {
      id: 2, cat: 'math', catLabel: '🔢 Math', emoji: '♾️',
      title: 'Infinity + 1',
      fact: 'Adding 1 to infinity doesn\'t make it bigger. But some infinities ARE bigger than others — the infinity of real numbers (like 3.14159…) is provably larger than the infinity of whole numbers. Mathematician Georg Cantor proved this in 1891.'
    },
    {
      id: 3, cat: 'math', catLabel: '🔢 Math', emoji: '🌀',
      title: 'The Fibonacci Spiral',
      fact: 'The sequence 1, 1, 2, 3, 5, 8, 13, 21… (each number = the two before it) creates a spiral that appears in sunflower seeds, pinecones, nautilus shells, and galaxies. Nature discovered this pattern before humans did.'
    },
    {
      id: 4, cat: 'math', catLabel: '🔢 Math', emoji: '🔴',
      title: 'Googol vs Googolplex',
      fact: 'A googol is 10¹⁰⁰ — a 1 followed by 100 zeros. A googolplex is 10^googol — a 1 followed by a googol of zeros. A googolplex is so large that you could NOT write it out even if every atom in the observable universe were a digit.'
    },
    {
      id: 5, cat: 'math', catLabel: '🔢 Math', emoji: '📐',
      title: 'Pi Goes Forever',
      fact: 'π (pi) = 3.14159265358979… and it NEVER repeats, NEVER ends. Computers have calculated it to over 100 trillion decimal places. Somewhere in those digits, your birthday appears — and so does every number ever written.'
    },
    {
      id: 6, cat: 'math', catLabel: '🔢 Math', emoji: '✂️',
      title: 'The Infinite Hotel',
      fact: 'Hilbert\'s Hotel is a thought experiment: a hotel with infinite rooms is full. A new guest arrives — no problem! Move guest in room 1 to room 2, room 2 to room 3, and so on. Room 1 is now free. Infinity works very strangely.'
    },
    {
      id: 7, cat: 'math', catLabel: '🔢 Math', emoji: '🎲',
      title: 'The Largest Known Prime',
      fact: 'As of 2024, the largest known prime has 41 million digits. It belongs to a special family called Mersenne primes: 2ⁿ − 1. Finding new primes wins you prize money — the Electronic Frontier Foundation offers $150,000 for a 100-million-digit prime.'
    },
    {
      id: 8, cat: 'math', catLabel: '🔢 Math', emoji: '🔑',
      title: 'Zero Was Invented',
      fact: 'Zero was invented by Indian mathematician Brahmagupta around 628 AD. Before that, most civilizations had no symbol for nothing — they just left a blank space. Zero made our entire number system, computers, and calculus possible.'
    },
    {
      id: 9, cat: 'math', catLabel: '🔢 Math', emoji: '⬡',
      title: 'Hexagons Everywhere',
      fact: 'Hexagons are the most efficient shape for tiling a flat surface — they pack the most area using the least perimeter. That\'s why bees evolved to build hexagonal honeycombs: they use minimum wax for maximum honey storage.'
    },
    {
      id: 10, cat: 'math', catLabel: '🔢 Math', emoji: '🌊',
      title: 'Fractals Are Infinite Edges',
      fact: 'The coastline of Britain is infinitely long — the more precisely you measure it (using smaller and smaller rulers), the longer it gets. This is the "coastline paradox," and it led mathematician Benoit Mandelbrot to invent fractal geometry in 1975.'
    },
    {
      id: 11, cat: 'math', catLabel: '🔢 Math', emoji: '🏆',
      title: 'Fermat\'s Last Theorem',
      fact: 'In 1637, Pierre de Fermat scribbled in a book: "I have a marvellous proof that no whole numbers a, b, c satisfy aⁿ+bⁿ=cⁿ for n>2." He never wrote it down. The proof wasn\'t found for 358 years — mathematician Andrew Wiles solved it in 1995 using 200 pages.'
    },
    {
      id: 12, cat: 'math', catLabel: '🔢 Math', emoji: '🎴',
      title: 'The Golden Ratio',
      fact: 'The golden ratio φ ≈ 1.618… appears when you divide a line so the whole/long = long/short. It appears in the Parthenon, Leonardo da Vinci\'s paintings, credit card proportions, and the ratio of consecutive Fibonacci numbers.'
    },
    {
      id: 13, cat: 'math', catLabel: '🔢 Math', emoji: '🧊',
      title: 'Euler\'s Identity',
      fact: 'eⁱπ + 1 = 0. This single equation — called "the most beautiful in mathematics" — connects five fundamental constants: e (the base of natural logs), i (imaginary unit), π (pi), 1, and 0. Physicist Richard Feynman called it "our jewel."'
    },
    {
      id: 14, cat: 'math', catLabel: '🔢 Math', emoji: '🔵',
      title: 'The Four Color Theorem',
      fact: 'Any map can be colored with just 4 colors so no two neighboring regions share a color. Mathematicians suspected this for 120 years. In 1976 it was finally proven — but only by checking 1,936 special cases with a computer. Many mathematicians found that uncomfortable.'
    },
    {
      id: 15, cat: 'math', catLabel: '🔢 Math', emoji: '🧩',
      title: 'The Collatz Conjecture',
      fact: 'Take any number. If even, divide by 2. If odd, multiply by 3 and add 1. Keep going — you always seem to reach 1 eventually. Mathematicians have checked this for quadrillions of numbers. But nobody has proven it ALWAYS works. It\'s one of math\'s most famous unsolved puzzles.'
    },
    {
      id: 16, cat: 'math', catLabel: '🔢 Math', emoji: '📊',
      title: 'Pascal\'s Triangle Hides Everything',
      fact: 'Pascal\'s triangle looks simple (each number = sum of two above), but inside it hides: Fibonacci numbers, powers of 2, powers of 11, triangular numbers, the binomial theorem, and fractal patterns. It\'s one of the most information-dense simple structures in mathematics.'
    },
    {
      id: 17, cat: 'math', catLabel: '🔢 Math', emoji: '♾',
      title: 'Some Infinities Are Bigger',
      fact: 'Georg Cantor proved there are different sizes of infinity. The counting numbers {1, 2, 3…} are "countably infinite." But the real numbers (including all decimals) are "uncountably infinite" — a strictly bigger infinity. His proof using "diagonalization" is one of the cleverest in all mathematics.'
    },
    {
      id: 18, cat: 'math', catLabel: '🔢 Math', emoji: '🔮',
      title: 'The Banach-Tarski Paradox',
      fact: 'In pure mathematics, it\'s theoretically possible to take a solid ball, cut it into 5 pieces, and reassemble them into TWO balls identical to the original. This is mathematically proven — it\'s not a trick. It works because of infinite precision and something called the Axiom of Choice.'
    },
    {
      id: 19, cat: 'math', catLabel: '🔢 Math', emoji: '🌐',
      title: 'Graph Theory Started With Bridges',
      fact: 'In 1736, Leonhard Euler solved the "Seven Bridges of Königsberg" — could you walk across all 7 bridges exactly once? He proved you couldn\'t, and invented graph theory to do it. Graph theory now powers Google Maps, Facebook\'s friend networks, and how the internet routes data.'
    },
    {
      id: 20, cat: 'math', catLabel: '🔢 Math', emoji: '🔄',
      title: 'Kaprekar\'s Constant',
      fact: 'Take any 4-digit number (not all same digits). Arrange digits largest→smallest, then smallest→largest. Subtract. Repeat. Within 7 steps you ALWAYS reach 6174 — Kaprekar\'s constant. Example: 1234 → 4321−1234=3087 → 8730−0378=8352 → 8532−2358=6174. Every time.'
    },

    // ── CHESS (15 facts) ──────────────────────────
    {

      fact: 'Chess originated in India around 600 AD as a game called "Chaturanga" — meaning four military divisions: infantry, cavalry, elephants, and chariots. These became our pawns, knights, bishops, and rooks. It spread to Persia, then Arabia, then Europe.'
    },
    {
      id: 22, cat: 'chess', catLabel: '♟️ Chess', emoji: '⏱️',
      title: 'The Longest Game',
      fact: 'The longest recorded chess game lasted 269 moves between Ivan Nikolic and Goran Arsovic in 1989 — over 20 hours! They drew. Modern rules now limit games to 75 moves without a pawn move or capture, to prevent this.'
    },
    {
      id: 23, cat: 'chess', catLabel: '♟️ Chess', emoji: '💡',
      title: 'More Games Than Atoms',
      fact: 'The number of possible chess games is estimated at 10¹²⁰ — the "Shannon Number." The entire observable universe has about 10⁸⁰ atoms. So there are vastly more possible chess games than atoms in the universe. No computer has ever "solved" chess completely.'
    },
    {
      id: 24, cat: 'chess', catLabel: '♟️ Chess', emoji: '👑',

    },
    {
      id: 25, cat: 'chess', catLabel: '♟️ Chess', emoji: '🤖',
      title: 'Deep Blue Beat a Champion',
      fact: 'In 1997, IBM\'s chess computer Deep Blue defeated World Champion Garry Kasparov in a 6-game match 3.5–2.5 — the first time a computer beat a world champion under standard conditions. Kasparov was furious and demanded a rematch that never happened.'
    },
    {
      id: 26, cat: 'chess', catLabel: '♟️ Chess', emoji: '🎯',
      title: 'The Scholar\'s Mate',
      fact: 'Checkmate in 4 moves is called the Scholar\'s Mate: e4, Bc4, Qh5, Qxf7#. It only works if the opponent makes weak moves — but it\'s the first trap every beginner must learn to avoid. Knowing a trap is half of not falling into it.'
    },
    {
      id: 27, cat: 'chess', catLabel: '♟️ Chess', emoji: '♖',
      title: 'Castling Was Added Later',
      fact: 'Castling — moving the king two squares toward a rook, which jumps over — was added to European chess around the 15th century to speed up the game. It\'s the only move where you move two pieces at once AND the only move where the king moves more than one square.'

    {
      id: 28, cat: 'chess', catLabel: '♟️ Chess', emoji: '🌟',
      title: 'The Immortal Game',
      fact: 'The "Immortal Game" (Anderssen vs Kieseritzky, 1851) is considered the most beautiful chess game ever played. Anderssen sacrificed both rooks, his bishop, AND his queen, then delivered checkmate with minor pieces. He gave away everything to win with nothing.'
    },
    {
      id: 29, cat: 'chess', catLabel: '♟️ Chess', emoji: '🧠',

    {

      title: 'The Queen Was a King',
      fact: 'In early chess, the piece next to the king was called the "vizier" (advisor) and could only move one square diagonally. Around 1470, the piece became "la dama" (the queen) in Spain and gained its current unlimited diagonal AND straight movement — the most powerful piece.'
    },
    {
      id: 31, cat: 'chess', catLabel: '♟️ Chess', emoji: '🔣',

    },
    {
      id: 32, cat: 'chess', catLabel: '♟️ Chess', emoji: '♛',

      fact: '"En passant" is French for "in passing." If your pawn is on the 5th rank and the opponent\'s pawn advances two squares past yours, you can capture it AS IF it only moved one square. It\'s the rarest legal move in chess and surprises players who never learned it.'
    },

    },
    {
      id: 100, cat: 'space', catLabel: '🌌 Space', emoji: '🌟',
      title: 'The Fermi Paradox',
      fact: '"Where is everybody?" In a galaxy with 400 billion stars, many billions of Earth-like planets, and 13.8 billion years of time, where are the aliens? Physicist Enrico Fermi asked this in 1950. The absence of contact is one of the great unsolved mysteries. Proposed explanations range from "we\'re rare" to "they\'re hiding" to "they\'re gone."'
    },
  ];

  // ─────────────────────────────────────────────
  //  STATE
  // ─────────────────────────────────────────────
  const TOTAL = FACTS.length; // 100
  let seen = new Set(JSON.parse(localStorage.getItem('books_seen') || '[]'));
  let activeFilter = 'all';

  // ─────────────────────────────────────────────
  //  CATEGORY METADATA
  // ─────────────────────────────────────────────
  const CATEGORIES = [
    { id: 'all',       label: 'All' },
    { id: 'math',      label: '🔢 Math' },
    { id: 'chess',     label: '♟️ Chess' },
    { id: 'bitcoin',   label: '₿ Bitcoin' },
    { id: 'music',     label: '🎵 Music' },
    { id: 'robotics',  label: '🤖 Robotics' },
    { id: 'languages', label: '🌍 Languages' },
    { id: 'space',     label: '🌌 Space' },
  ];

  // ─────────────────────────────────────────────
  //  BUILD FILTER PILLS
  // ─────────────────────────────────────────────
  const filterBar = document.getElementById('filterBar');
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (c.id === 'all' ? ' active' : '');
    btn.textContent = c.label;
    btn.dataset.cat = c.id;
    btn.addEventListener('click', () => {
      activeFilter = c.id;
      filterBar.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    });
    filterBar.appendChild(btn);
  });

  // ─────────────────────────────────────────────
  //  RENDER CARDS
  // ─────────────────────────────────────────────
  function renderCards() {
    const grid = document.getElementById('cardGrid');
    const empty = document.getElementById('emptyState');
    const filtered = activeFilter === 'all' ? FACTS : FACTS.filter(f => f.cat === activeFilter);
    grid.innerHTML = '';

    if (filtered.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    filtered.forEach(f => {
      const isSeen = seen.has(f.id);
      const card = document.createElement('div');
      card.className = 'card' + (isSeen ? ' flipped seen' : '');
      card.dataset.id = f.id;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">
            <span class="seen-dot"></span>
            <div class="card-emoji">${f.emoji}</div>
            <div class="card-category">${f.catLabel}</div>
            <div class="card-title">${f.title}</div>
            <div class="card-tap-hint">tap to reveal</div>
          </div>
          <div class="card-back cat-${f.cat}">
            <div class="back-number">#${f.id}</div>
            <div class="back-emoji">${f.emoji}</div>
            <div class="back-fact">${f.fact}</div>
            <div class="back-tap-hint">tap to flip back</div>
          </div>
        </div>
      `;
      card.addEventListener('click', () => toggleCard(card, f.id));
      grid.appendChild(card);
    });
  }

  // ─────────────────────────────────────────────
  //  TOGGLE + PERSIST
  // ─────────────────────────────────────────────
  function toggleCard(cardEl, id) {
    const wasFlipped = cardEl.classList.contains('flipped');
    cardEl.classList.toggle('flipped');
    if (!wasFlipped) {
      cardEl.classList.add('seen');
      seen.add(id);
    }
    // Note: we keep seen even if flipped back (discovery is permanent)
    localStorage.setItem('books_seen', JSON.stringify([...seen]));
    updateCounter();
  }

  // ─────────────────────────────────────────────
  //  COUNTER
  // ─────────────────────────────────────────────
  function updateCounter() {
    const n = seen.size;
    document.getElementById('discoveryText').textContent = `Discovered: ${n} / ${TOTAL}`;
    document.getElementById('discoveryFill').style.width = `${(n / TOTAL) * 100}%`;
  }

  // ─────────────────────────────────────────────
  //  INIT
  // ─────────────────────────────────────────────
  renderCards();
  updateCounter();
  </script>

  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
