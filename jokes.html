<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cassian">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Smart Jokes — Cassian's Super App</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(160deg,#FFF8F0 0%,#F0F4FF 55%,#F0FFF8 100%);min-height:100dvh;color:#1E1B4B;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.page{max-width:700px;margin:0 auto;padding:28px 16px 20px}
.hdr{text-align:center;margin-bottom:22px}
.hdr-emoji{font-size:52px;display:block;margin-bottom:8px;animation:wiggle 2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.hdr h1{font-size:32px;font-weight:900;color:#1E1B4B;margin-bottom:4px}
.hdr p{color:rgba(30,27,75,.45);font-size:14px;font-weight:700}
.jotd{background:white;border-radius:22px;padding:20px;margin-bottom:20px;box-shadow:0 4px 24px rgba(251,191,36,.2);border:2px solid rgba(251,191,36,.25);position:relative;overflow:hidden}
.jotd::before{content:'😂';position:absolute;right:14px;top:10px;font-size:44px;opacity:.08;pointer-events:none}
.jotd-tag{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#D97706;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.jotd-q{font-size:19px;font-weight:800;line-height:1.45;color:#1E1B4B;margin-bottom:14px}
.jotd-a{font-size:16px;font-weight:700;color:#059669;background:#F0FDF4;border:1px solid #D1FAE5;border-radius:12px;padding:12px 14px;display:none;line-height:1.55;margin-bottom:12px}
.jotd-btn{background:linear-gradient(135deg,#F59E0B,#FBBF24);border:none;color:white;padding:11px 26px;border-radius:50px;font-size:14px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;transition:transform .15s;box-shadow:0 4px 14px rgba(245,158,11,.35)}
.jotd-btn:active{transform:scale(.95)}
.jotd-btn:disabled{background:#E5E7EB;color:#9CA3AF;box-shadow:none}
.jotd-tomorrow{font-size:11px;font-weight:800;color:rgba(30,27,75,.3);margin-top:10px}
.lang-pick{display:flex;gap:8px;justify-content:center;margin-bottom:18px;background:white;border-radius:18px;padding:6px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.lang-btn{flex:1;padding:10px 8px;border-radius:12px;border:none;background:transparent;color:rgba(30,27,75,.4);font-size:15px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s}
.lang-btn.active{background:linear-gradient(135deg,#F59E0B,#FBBF24);color:white;box-shadow:0 3px 10px rgba(245,158,11,.3)}
.score-bar{text-align:center;font-size:13px;font-weight:700;color:rgba(30,27,75,.45);margin-bottom:16px}
.score-bar span{color:#D97706;font-size:16px;font-weight:900}
.jokes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.flip-wrap{perspective:900px;height:180px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-wrap.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.flip-front{background:white;box-shadow:0 4px 16px rgba(0,0,0,.07);border:2px solid rgba(245,158,11,.15)}
.flip-back{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);box-shadow:0 4px 20px rgba(245,158,11,.15);border:2px solid rgba(245,158,11,.3);transform:rotateY(180deg)}
.flip-front .cat{font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#D97706;margin-bottom:9px}
.flip-front .q{font-size:15px;font-weight:800;line-height:1.45;color:#1E1B4B}
.flip-front .hint{font-size:11px;color:rgba(30,27,75,.3);margin-top:8px;font-weight:700}
.flip-back .a{font-size:16px;font-weight:800;line-height:1.45;color:#92400E}
.flip-back .pts{font-size:12px;color:rgba(146,64,14,.6);margin-top:8px;font-weight:700}
.app-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;align-items:center;padding:8px 4px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:2px solid #EEF2FF;z-index:1000;box-shadow:0 -4px 20px rgba(99,102,241,.06)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#9CA3AF;transition:all .2s;padding:5px 10px;border-radius:12px}
.nav-btn.active,.nav-btn:hover{color:#6366F1}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:9px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <span class="hdr-emoji">😂</span>
    <h1>Smart Jokes</h1>
    <p>A new joke every single day!</p>
  </div>
  <div class="jotd">
    <div class="jotd-tag">🌟 Joke of the Day</div>
    <div class="jotd-q" id="jotdQ">Loading today's joke…</div>
    <div class="jotd-a" id="jotdA"></div>
    <button class="jotd-btn" id="jotdBtn" onclick="revealJotd()">Hear the punchline! 🥁</button>
    <div class="jotd-tomorrow">🌙 New joke tomorrow!</div>
  </div>
  <div class="lang-pick">
    <button class="lang-btn active" onclick="setLang('en')">🇬🇧 English</button>
    <button class="lang-btn" onclick="setLang('es')">🇪🇸 Español</button>
    <button class="lang-btn" onclick="setLang('ar')">🇸🇦 عربي</button>
  </div>
  <div class="score-bar">Jokes discovered: <span id="scoreNum">0</span> 😄</div>
  <div class="jokes-grid" id="jokesGrid"></div>
</div>
<nav class="app-nav">
  <a href="index.html" class="nav-btn"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
  <a href="numberblocks.html" class="nav-btn"><span class="nav-icon">🔢</span><span class="nav-label">Numbers</span></a>
  <a href="games.html" class="nav-btn"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  <a href="chess.html" class="nav-btn"><span class="nav-icon">♟️</span><span class="nav-label">Chess</span></a>
  <a href="cosmo.html" class="nav-btn"><span class="nav-icon">🤖</span><span class="nav-label">Cosmo</span></a>
</nav>
<script>
const JOKES={
  en:[
    {cat:'🔢 MATH',q:'Why was 6 afraid of 7?',a:'Because 7 ATE 9! (7, 8, 9) 🍽️'},
    {cat:'🔢 MATH',q:'What did zero say to eight?',a:'"Nice belt!" 😄 (the 8 looks like a belt in the middle!)'},
    {cat:'🔢 MATH',q:'How do you make 7 even?',a:"Drop the 'S'! s-EVEN → EVEN 😎"},
    {cat:'🔢 MATH',q:'Why was the math book sad?',a:'It had too many problems! 📚'},
    {cat:'🔢 MATH',q:'What has three corners but one point?',a:'A triangle! 3 corners, 1 pointy top 🔺'},
    {cat:'🔢 MATH',q:"Why is the number 10 so confident?",a:"Because it has a 1 in first place! 🥇"},
    {cat:'🔢 MATH',q:'What do you call numbers that go to the gym?',a:'Mathe-MUSCLES! 💪 (mathematics)'},
    {cat:'🔢 MATH',q:'Why did the student eat his homework?',a:"Because the teacher told him it was a piece of cake! 🎂"},
    {cat:'♟️ CHESS',q:'Why did the chess piece go to school?',a:'To become a knight in shining knowledge! 🐴'},
    {cat:'♟️ CHESS',q:'What do chess players eat for breakfast?',a:'Pawn-cakes! 🥞 With check-olate sauce!'},
    {cat:'♟️ CHESS',q:'Why are bishops so hard to argue with?',a:'They always come at you diagonally — never straight! 😅'},
    {cat:'♟️ CHESS',q:"Why is the chess board always nervous?",a:"It's always in check! ♟️"},
    {cat:'♟️ CHESS',q:"What's a king's favourite subject?",a:'His-tory! He writes the history! 👑📖'},
    {cat:'🤖 ROBOT',q:'Why did the robot go back to school?',a:'To improve its byte! 💻 (bite → byte)'},
    {cat:'🤖 ROBOT',q:'What do you call a robot that always takes the long way?',a:"A roamin' numeral! 🗺️ (Roman numeral)"},
    {cat:'🤖 ROBOT',q:'Why did the robot get a sunburn?',a:'Its screen-saver turned off! ☀️💻'},
    {cat:'🎹 MUSIC',q:'What do you call a piano that fell into a mine shaft?',a:'A flat minor! 🎹 (Flat = music note going down; Minor = small/young)'},
    {cat:'🎹 MUSIC',q:'Why did the music teacher need a ladder?',a:'To reach the high notes! 🪜🎵'},
    {cat:'🌍 LANGUAGE',q:'Why are math teachers great at Spanish?',a:'Because they know all about the SUM-brero! 🪅'},
    {cat:'💰 MONEY',q:'Why is money called dough?',a:"Because everyone kneads it! 🍞 (knead = need)"},
    {cat:'💰 MONEY',q:'What do you call a rich elf?',a:'Welfy! (wealthy) 🧝‍♂️✨'},
    {cat:'🔢 MATH',q:'What do you call an angle that is adorable?',a:'A-cute angle! (Acute angle = less than 90°) 😍📐'},
    {cat:'♟️ CHESS',q:'Why did the rook go to the party?',a:"Because it heard there'd be CASTLE-ing! 🏰"},
  ],
  es:[
    {cat:'🔢 MATES',q:'¿Por qué el 6 tiene miedo del 7?',a:'¡Porque el 7, 8, 9! El siete se comió al nueve 😱'},
    {cat:'🔢 MATES',q:'¿Qué le dijo el cero al ocho?',a:'"¡Bonito cinturón!" 😄 (el 8 parece llevar un cinturón)'},
    {cat:'🔢 MATES',q:'¿Por qué el libro de matemáticas estaba triste?',a:'¡Tenía demasiados problemas! 📚'},
    {cat:'🔢 MATES',q:'¿Cuántos meses tienen 28 días?',a:'¡Todos! Cada mes tiene AL MENOS 28 días 📅'},
    {cat:'🔢 MATES',q:'¿Qué le dijo el ángulo obtuso al ángulo recto?',a:'"¡Nunca tienes razón!" 📐'},
    {cat:'🔢 MATES',q:'¿Qué hace el cero cuando tiene frío?',a:'¡Se pone un cero-te! (abrigo) 🧥'},
    {cat:'♟️ AJEDREZ',q:'¿Qué desayunan los jugadores de ajedrez?',a:'¡Peones fritos! 🍳'},
    {cat:'♟️ AJEDREZ',q:'¿Cómo llaman al caballo de ajedrez?',a:'¡El Señor Ele! Porque siempre se mueve en forma de L 🐴'},
    {cat:'♟️ AJEDREZ',q:'¿Por qué el rey de ajedrez es tan lento?',a:'¡Solo puede moverse un paso a la vez! 👑'},
    {cat:'🤖 ROBOT',q:'¿Por qué fue el robot a la escuela?',a:'¡Para mejorar su memoria RAM! 🤖'},
    {cat:'🤖 ROBOT',q:'¿Qué hace un robot cuando se cansa?',a:'¡Se desconecta y recarga! ⚡'},
    {cat:'🎹 MÚSICA',q:'¿Por qué el piano fue al médico?',a:'¡Porque tenía notas muy malas! 🎹'},
    {cat:'💰 DINERO',q:'¿Por qué el dinero siempre está cansado?',a:'¡Porque la gente lo hace trabajar! 💰'},
    {cat:'🌍 IDIOMAS',q:'¿Cuál es el número más romántico en español?',a:'¡El NUEVE! (new-vein = novio/novia) ❤️'},
    {cat:'🔢 MATES',q:'¿Por qué los matemáticos van a la playa?',a:'¡Para usar sus trajes de baño... y sus tangentes! 📐🌊'},
  ],
  ar:[
    {cat:'🔢 رياضيات',q:'ماذا قال الصفر للرقم ثمانية؟',a:'"أعجبني حزامك!" 😄 (الرقم 8 يشبه حزاماً)'},
    {cat:'🔢 رياضيات',q:'لماذا كان كتاب الرياضيات حزيناً؟',a:'لأن له مشاكل كثيرة! 📚'},
    {cat:'🔢 رياضيات',q:'ما هو أذكى رقم؟',a:'الرقم واحد! لأنه دائماً في المركز الأول 🥇'},
    {cat:'🔢 رياضيات',q:'ماذا قال المثلث للمربع؟',a:'"لديك زاوية إضافية!" 📐'},
    {cat:'♟️ شطرنج',q:'كيف يتحرك الحصان في الشطرنج؟',a:'بشكل حرف L! ♞ الحصان يقفز فوق القطع!'},
    {cat:'♟️ شطرنج',q:'لماذا الوزير أقوى قطعة؟',a:'لأنها تتحرك في كل الاتجاهات! ♛'},
    {cat:'🤖 روبوت',q:'لماذا يحب الروبوت الأرقام؟',a:'لأنه مصنوع من صفر وواحد فقط: 0 و 1! 🤖'},
    {cat:'💰 مال',q:'ما الرقم المفضل لدى التاجر الذكي؟',a:'العشرة مرات! 💰'},
    {cat:'🌟 مضحك',q:'ما هو الرقم الأحمر؟',a:'لا يوجد! الأرقام ليست لها ألوان... إلا عند كاسيان! 🌈'},
  ]
};

const ALL_EN=JOKES.en;
const today=new Date();
const dayKey=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
const jotdIdx=dayKey%ALL_EN.length;
const jotd=ALL_EN[jotdIdx];
document.getElementById('jotdQ').textContent=jotd.q;
const jotdDoneKey='jotd_done_'+dayKey;
if(localStorage.getItem(jotdDoneKey)){
  document.getElementById('jotdA').textContent=jotd.a;
  document.getElementById('jotdA').style.display='block';
  const btn=document.getElementById('jotdBtn');
  btn.textContent='🌙 New joke tomorrow!';btn.disabled=true;
}
let jotdShown=false;
function revealJotd(){
  if(!jotdShown){
    document.getElementById('jotdA').textContent=jotd.a;
    document.getElementById('jotdA').style.display='block';
    document.getElementById('jotdBtn').textContent='😂 Got it! Tap again to save';
    jotdShown=true;
  }else{
    localStorage.setItem(jotdDoneKey,'1');
    document.getElementById('jotdBtn').textContent='🌙 New joke tomorrow!';
    document.getElementById('jotdBtn').disabled=true;
  }
}

let lang='en';
let discovered=new Set(JSON.parse(localStorage.getItem('jokes_disc')||'[]'));
updateScore();
function setLang(l){lang=l;document.querySelectorAll('.lang-btn').forEach((b,i)=>b.classList.toggle('active',['en','es','ar'][i]===l));renderJokes();}
function renderJokes(){
  const grid=document.getElementById('jokesGrid');
  grid.innerHTML='';grid.style.direction=lang==='ar'?'rtl':'ltr';
  JOKES[lang].forEach((joke,i)=>{
    const id=lang+'_'+i;
    const wrap=document.createElement('div');
    wrap.className='flip-wrap'+(discovered.has(id)?' flipped':'');
    wrap.innerHTML=`<div class="flip-inner"><div class="flip-front"><div class="cat">${joke.cat}</div><div class="q">${joke.q}</div><div class="hint">Tap to reveal! 👆</div></div><div class="flip-back"><div class="a">${joke.a}</div><div class="pts">😄 Got it!</div></div></div>`;
    wrap.onclick=()=>{
      wrap.classList.toggle('flipped');
      if(wrap.classList.contains('flipped')&&!discovered.has(id)){discovered.add(id);localStorage.setItem('jokes_disc',JSON.stringify([...discovered]));updateScore();}
    };
    grid.appendChild(wrap);
  });
}
function updateScore(){document.getElementById('scoreNum').textContent=discovered.size;}
renderJokes();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
