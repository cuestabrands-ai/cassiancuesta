<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cassian">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Numberblocks 🔢 — Cassian's Super App</title>
<link rel="manifest" href="/manifest.json">
<script src="/cassian-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#F8F9FF}
body{display:flex;flex-direction:column;height:100dvh;font-family:'Nunito',system-ui,sans-serif;color:#1E1B4B}
.game-frame{flex:1;min-height:0;position:relative}
.game-frame iframe{width:100%;height:100%;border:none;display:block}
/* Setup screen */
.setup{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:#1E1B4B;font-family:'Nunito',system-ui,sans-serif;gap:10px}
.setup h2{font-size:22px;font-weight:800;color:#6366F1;margin-bottom:4px}
.setup p{font-size:14px;color:#6B7280;line-height:1.6;max-width:340px}
.setup .step{background:white;border:1.5px solid #E5E7EB;border-radius:14px;padding:13px 16px;font-size:14px;text-align:left;width:100%;max-width:340px;color:#1E1B4B}
.setup .step strong{color:#6366F1}
.setup button{margin-top:8px;padding:12px 32px;border-radius:50px;background:#6366F1;border:none;color:white;font-size:15px;font-weight:800;cursor:pointer;font-family:'Nunito',system-ui,sans-serif}
/* Page header */
.page-header{background:linear-gradient(180deg,#EEF2FF 0%,#F8F9FF 100%);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;text-align:center;border-bottom:1px solid #C7D2FE}
.header-emoji{font-size:40px;animation:float 3s ease-in-out infinite;line-height:1;margin-bottom:4px}
.header-title{font-size:20px;font-weight:900;color:#3730A3;margin-bottom:2px}
.header-sub{font-size:12px;font-weight:700;color:#6366F1}
/* Nav */
.app-nav{background:white;display:flex;justify-content:space-around;align-items:center;padding:8px 4px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ECEDF2;z-index:100;flex-shrink:0}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#9CA3AF;transition:all .2s;padding:5px 10px;border-radius:12px}
.nav-btn.active{color:#6366F1}
.nav-icon{font-size:22px;line-height:1;transition:transform .2s}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-label{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-family:'Nunito',system-ui,sans-serif}

/* TC-12 LIGHT DESIGN SYSTEM */
*{-webkit-tap-highlight-color:transparent}
html,body{background:#F8F9FF!important;color:#1E1B4B}
body::before{display:none!important}
@keyframes fade-up{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
[style*="backdrop-filter"],[class*="glass"]{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.section-label,.section-title{color:#A5B4FC!important;font-weight:900}
input,textarea,select{background:white!important;border:1.5px solid #E5E7EB!important;border-radius:12px!important;color:#1E1B4B!important;font-family:'Nunito',system-ui,sans-serif!important}
input:focus,textarea:focus,select:focus{border-color:#6366F1!important;outline:none!important}
.star-field,.stars,.starfield,.bg-overlay{display:none!important}
.star{display:none!important}
</style>
</head>
<body>
<div class="page-header" style="flex-shrink:0">
  <div class="header-emoji">🔢</div>
  <div class="header-title">Numberblocks</div>
  <div class="header-sub">Explore numbers · Find patterns · Go huge!</div>
</div>
<div class="game-frame" id="gameFrame">
  <iframe src="nb-scratch.html" id="nbFrame" allowfullscreen title="Numberblocks"></iframe>
</div>
<nav class="app-nav">
  <a href="index.html" class="nav-btn"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
  <a href="numberblocks.html" class="nav-btn active"><span class="nav-icon">🔢</span><span class="nav-label">Numbers</span></a>
  <a href="games.html" class="nav-btn"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  <a href="chess.html" class="nav-btn"><span class="nav-icon">♟️</span><span class="nav-label">Chess</span></a>
  <a href="cosmo.html" class="nav-btn"><span class="nav-icon">🤖</span><span class="nav-label">Cosmo</span></a>
</nav>
<script>
// Inject CSS into iframe to hide TurboWarp's duplicate player controls/slider
document.getElementById('nbFrame').addEventListener('load', function() {
  try {
    const doc = this.contentDocument || this.contentWindow.document;
    const s = doc.createElement('style');
    s.textContent = `
      /* Hide TurboWarp player controls bar — keeps only the game's own slider */
      .controls-bar, .player-controls, #controls,
      .green-flag, .stop-all, .turbo-container,
      .stage-controls, [class*="stage-header"],
      .tw-controls, .player-footer,
      input[type=range] ~ input[type=range],
      input[type=range]:nth-of-type(2) { display:none !important; }
    `;
    doc.head.appendChild(s);
  } catch(e) { /* cross-origin blocked — nothing we can do */ }
});

CassianGate.check('numberblocks','Numberblocks','🔢');
if(window.location.protocol==='file:'){
  // On file:// protocol, fetch is blocked — just trust the iframe to load
  // If nb-scratch.html is missing, the iframe will be blank (acceptable)
} else {
  fetch('nb-scratch.html',{method:'HEAD'})
    .then(r=>{if(!r.ok)showSetup();})
    .catch(()=>showSetup());
}
function showSetup(){
  document.getElementById('gameFrame').innerHTML=`
    <div class="setup">
      <div style="font-size:52px">🔢</div>
      <h2>One Setup Step Needed</h2>
      <p>The Numberblocks game file needs to be downloaded once. Here's how:</p>
      <div class="step"><strong>Step 1:</strong> Go to <strong>packager.turbowarp.org</strong> on a computer</div>
      <div class="step"><strong>Step 2:</strong> Enter project ID <strong style="color:#A29BFE;font-size:17px">1291946676</strong> and click Load</div>
      <div class="step"><strong>Step 3:</strong> Output → HTML file → Package → download</div>
      <div class="step"><strong>Step 4:</strong> Rename the file to <strong>nb-scratch.html</strong> and put it in the Cassian app folder</div>
      <button onclick="location.reload()">Tap here after setup ✓</button>
    </div>`;
}
</script>
<script>
(function(){
  let c=document.getElementById('stars');
  if(!c){c=document.createElement('div');c.id='stars';c.className='stars';c.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0';document.body.insertBefore(c,document.body.firstChild);}
  const cols=['rgba(6,182,212,VAL)','rgba(168,85,247,VAL)','rgba(241,245,249,VAL)'];
  for(let i=0;i<100;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    const col=cols[Math.floor(Math.random()*cols.length)].replace('VAL',(Math.random()*.7+.3).toFixed(2));
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${col};animation-duration:${(2+Math.random()*3).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s`;
    c.appendChild(s);
  }
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
