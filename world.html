*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a1a;font-family:'Nunito',system-ui,sans-serif;color:white;overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100dvh}
.page-wrap{flex:1;padding:20px 16px 110px;max-width:700px;margin:0 auto;width:100%}

/* Header */
.hero{text-align:center;margin-bottom:24px}
.hero-emoji{font-size:56px;display:block;animation:float 3s ease-in-out infinite;line-height:1;margin-bottom:8px}
.hero h1{font-size:30px;font-weight:900;background:linear-gradient(90deg,#FFD700,#FF8C00,#A29BFE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.hero p{color:rgba(255,255,255,.55);font-size:14px;font-weight:700}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Featured badge */
.featured-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(255,215,0,.2),rgba(255,140,0,.2));border:1.5px solid rgba(255,215,0,.5);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:900;color:#FFD700;margin-bottom:16px}

/* Search */
.search-wrap{margin-bottom:20px;position:relative}
.search-input{width:100%;padding:14px 16px 14px 44px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:16px;color:white;font-size:16px;font-family:'Nunito',sans-serif;outline:none;transition:border-color .2s}
.search-input:focus{border-color:rgba(255,215,0,.5)}
.search-input::placeholder{color:rgba(255,255,255,.3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}

/* Country grid */
.section-label{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:12px}
.country-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:500px){.country-grid{grid-template-columns:repeat(3,1fr)}}

.country-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:20px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.country-card:active{transform:scale(0.96)}
.country-card:hover{border-color:rgba(255,215,0,.4);background:rgba(255,255,255,.1);transform:translateY(-3px)}
.country-card.featured{border-color:rgba(255,215,0,.6);background:rgba(255,215,0,.08)}
.card-flag{font-size:44px;line-height:1;display:block;margin-bottom:8px}
.card-name{font-size:15px;font-weight:900;color:white;margin-bottom:2px}
.card-lang{font-size:11px;font-weight:700;color:rgba(255,255,255,.45)}
.trip-badge{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,#FFD700,#FF8C00);color:#1a1a00;font-size:9px;font-weight:900;padding:3px 7px;border-radius:10px;letter-spacing:.3px}

#phraseView.open{display:flex}
.phrase-header{background:rgba(10,8,30,.97);backdrop-filter:blur(20px);padding:16px;padding-top:calc(16px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.back-btn{width:44px;height:44px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phrase-country-info{flex:1}
.phrase-flag{font-size:36px;line-height:1}
.phrase-country-name{font-size:20px;font-weight:900;color:white;margin-top:2px}
.phrase-lang-label{font-size:12px;color:rgba(255,255,255,.45);font-weight:700}

.phrase-scroll{flex:1;overflow-y:auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom)) 16px}
.phrase-intro{text-align:center;padding:12px 16px 20px;font-size:14px;color:rgba(255,255,255,.55);line-height:1.5;font-weight:700}

.phrase-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.09);border-radius:20px;padding:18px;margin-bottom:12px;position:relative}
.phrase-category{font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px}
.phrase-english{font-size:13px;font-weight:700;color:rgba(255,255,255,.4);margin-bottom:10px}
.phrase-main{font-size:26px;font-weight:900;color:white;margin-bottom:6px;line-height:1.2}
.phrase-pronunciation{font-size:13px;font-weight:700;color:#A29BFE;font-style:italic;margin-bottom:12px}
.speak-btn{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none;border-radius:50px;color:white;font-size:13px;font-weight:900;padding:9px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .1s;font-family:'Nunito',sans-serif}

.phrase-tip{font-size:12px;color:rgba(255,255,255,.35);margin-top:10px;line-height:1.5;font-weight:700;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}

.section-divider{text-align:center;margin:20px 0 12px;position:relative}
.section-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,.08)}
.section-divider span{background:#0a0a1a;padding:0 12px;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);position:relative}

.app-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,8,30,.97);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;padding:8px 4px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1);z-index:100}

.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}

.tip-banner{background:rgba(162,155,254,.1);border:1.5px solid rgba(162,155,254,.25);border-radius:16px;padding:14px 16px;margin-bottom:20px;display:flex;align-items:flex-start;gap:10px}
.tip-emoji{font-size:24px;flex-shrink:0}
.tip-text{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);line-height:1.5}


/* ── SPACE MISSION NAV ── */
.app-nav{background:rgba(4,4,12,.92)!important;backdrop-filter:blur(28px)!important;border-top:1px solid rgba(255,255,255,.07)!important;box-shadow:none!important}
.nav-btn{color:rgba(241,245,249,.4)!important}
.nav-btn.active,.nav-btn:hover{color:#06B6D4!important}
/* ── SPACE MISSION BODY ── */
body{background:#06060F!important;color:#F1F5F9!important}
body::before{display:block!important}
.stars{display:block!important}

      {cat:'😊 You\'re welcome',en:'You\'re welcome',word:'不客气 (Bù kèqì)',pron:'Boo keh-CHEE',tip:'Means "Don\'t be polite" — a humble and kind response.'},
      {cat:'😔 Sorry',en:'Sorry',word:'对不起 (Duìbuqǐ)',pron:'DWAY-boo-chee',tip:'A genuinely heartfelt apology. Shows real respect.'},
      {cat:'🤝 Excuse me',en:'Excuse me',word:'不好意思 (Bù hǎo yìsī)',pron:'Boo how ee-SUH',tip:'Means "I\'m a bit embarrassed" — very endearing to say!'},
      {cat:'👋 Goodbye',en:'Goodbye',word:'再见 (Zàijiàn)',pron:'DZYE-jyen',tip:'Means "See again" — lovely way to say goodbye!'},
    ]
  },
];

let currentCountry = null;
let allCountries = [...COUNTRIES];

// ── Render country grids ──
function renderGrids(list) {
  const featured = list.filter(c => c.featured);
  const all = list.filter(c => !c.featured);
  document.getElementById('featuredGrid').innerHTML = featured.map(countryCard).join('');
  document.getElementById('allGrid').innerHTML = all.map(countryCard).join('');
}

function countryCard(c) {
  return `<div class="country-card${c.featured?' featured':''}" onclick="openCountry('${c.id}')">
    ${c.featured ? '<span class="trip-badge">✈️ This Week!</span>' : ''}
    <span class="card-flag">${c.flag}</span>
    <div class="card-name">${c.name}</div>
    <div class="card-lang">${c.lang}</div>
  </div>`;
}

function filterCountries(q) {
  const filtered = COUNTRIES.filter(c =>
    c.name.toLowerCase().includes(q.toLowerCase()) ||
    c.lang.toLowerCase().includes(q.toLowerCase())
  );
  renderGrids(filtered);
}

// ── Open country phrase view ──
function openCountry(id) {
  currentCountry = COUNTRIES.find(c => c.id === id);
  if (!currentCountry) return;

  document.getElementById('phraseFlag').textContent = currentCountry.flag;
  document.getElementById('phraseCountryName').textContent = currentCountry.name;
  document.getElementById('phraseLangLabel').textContent = currentCountry.lang + ' phrases';

  const scroll = document.getElementById('phraseScroll');
  scroll.innerHTML = `
    <p class="phrase-intro">Tap 🔊 to hear how it sounds! Practice each phrase out loud — that's how you really learn! 🎉</p>
    <button class="speak-all-btn" onclick="speakAll()">🔊 Hear ALL phrases in ${currentCountry.lang}!</button>
    ${currentCountry.phrases.map(phraseCard).join('')}
    <div style="height:20px"></div>
  `;

  const view = document.getElementById('phraseView');
  view.classList.add('open');
  scroll.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function phraseCard(p) {
  const safeWord = p.word.replace(/'/g,"&#39;").replace(/"/g,'&quot;');
  const safeLang = currentCountry.langCode;
  return `<div class="phrase-card">
    <div class="phrase-category">${p.cat}</div>
    <div class="phrase-english">${p.en} in English</div>
    <div class="phrase-main">${p.word}</div>
    <div class="phrase-pronunciation">🗣️ Say it: ${p.pron}</div>
    <button class="speak-btn" onclick="speak(${JSON.stringify(p.word.replace(/\(.*?\)/g,'').trim())}, '${safeLang}')">🔊 Hear it!</button>
    ${p.tip ? `<div class="phrase-tip">💡 ${p.tip}</div>` : ''}
  </div>`;
}

function closePhraseView() {
  document.getElementById('phraseView').classList.remove('open');
  document.body.style.overflow = '';
  currentCountry = null;
}

// ── Speech Synthesis ──
function speak(text, lang) {
  if (!('speechSynthesis' in window)) { alert('Your browser doesn\'t support speech. Try Chrome!'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  u.rate = 0.85;
  u.pitch = 1.1;
  // Pick a voice for the language if available
  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
  if (match) u.voice = match;
  window.speechSynthesis.speak(u);
}

function speakAll() {
  if (!currentCountry) return;
  window.speechSynthesis.cancel();
  const phrases = currentCountry.phrases;
  let i = 0;
  function next() {
    if (i >= phrases.length) return;
    const p = phrases[i++];
    const clean = p.word.replace(/\(.*?\)/g,'').replace(/[^\w\sÀ-ɏЀ-ӿ؀-ۿ　-鿿가-힯]/g,' ').trim();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = currentCountry.langCode;
    u.rate = 0.8;
    u.onend = () => setTimeout(next, 400);
    const voices = window.speechSynthesis.getVoices();
    const match = voices.find(v => v.lang.startsWith(currentCountry.langCode.split('-')[0]));
    if (match) u.voice = match;
    window.speechSynthesis.speak(u);
  }
  next();
}

// Load voices (some browsers need this)
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener('voiceschanged', () => window.speechSynthesis.getVoices());
}

// ── Init ──
renderGrids(COUNTRIES);
</script>

(function(){
  let c=document.getElementById('stars');
  if(!c){c=document.createElement('div');c.id='stars';c.className='stars';c.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0';document.body.insertBefore(c,document.body.firstChild);}
  const cols=['rgba(6,182,212,VAL)','rgba(168,85,247,VAL)','rgba(241,245,249,VAL)'];
  for(let i=0;i<100;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    const col=cols[Math.floor(Math.random()*cols.length)].replace('VAL',(Math.random()*.7+.3).toFixed(2));
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${col};animation-duration:${(2+Math.random()*3).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s`;
    c.appendChild(s);
  }
})();
</script>
