<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🎹 Piano</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#06060F;height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;
  min-height:100dvh;color:#F1F5F9;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  overflow-x:hidden;user-select:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 20% 20%,rgba(139,92,246,.12) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%,rgba(245,158,11,.08) 0%,transparent 55%);
}

.page{width:100%;padding:20px 16px 12px;position:relative;z-index:1;max-width:900px;margin:0 auto}

/* ── HEADER ── */
.header{text-align:center;margin-bottom:16px}
.header-title{font-size:28px;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(90deg,#FBBF24,#F472B6,#A855F7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:4px}
.header-sub{font-size:12px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:1px}

/* ── MODE TOGGLE ── */
.mode-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.mode-btn{padding:8px 20px;border-radius:50px;font-size:13px;font-weight:900;
  border:1px solid rgba(255,255,255,.1);cursor:pointer;
  font-family:'Nunito',system-ui,sans-serif;
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.4);
  transition:all .2s}
.mode-btn.active{background:rgba(251,191,36,.15);color:#FBBF24;border-color:rgba(251,191,36,.35)}

/* ── SONG PANEL ── */
.song-panel{
  background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.15);
  border-radius:20px;padding:16px 18px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.song-name{font-size:13px;font-weight:900;color:#FBBF24;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.song-progress-track{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-bottom:12px}
.song-progress-fill{height:100%;background:linear-gradient(90deg,#FBBF24,#F472B6);border-radius:3px;transition:width .3s ease;width:0%}

/* ── NEXT NOTE DISPLAY ── */
.next-note-wrap{display:flex;align-items:center;gap:12px}
.next-label{font-size:10px;font-weight:900;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;flex-shrink:0}
.next-note-bubble{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:white;
  flex-shrink:0;
  animation:notePulse 1s ease-in-out infinite;
  box-shadow:0 0 20px var(--note-glow,rgba(251,191,36,.5));
  background:var(--note-color,#FBBF24);
}
@keyframes notePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.next-note-name{font-size:13px;font-weight:800;color:rgba(255,255,255,.5)}

.done-msg{font-size:18px;font-weight:900;color:#FBBF24;text-align:center;padding:8px 0;animation:notePulse 1s ease-in-out infinite}

/* ── FREE PLAY LABEL ── */
.free-label{text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.3);padding:8px 0 4px}

/* ── FEEDBACK FLASH ── */
.feedback{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:52px;z-index:999;pointer-events:none;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.feedback.show{transform:translate(-50%,-50%) scale(1)}

/* ── PIANO WRAP ── */
.piano-wrap{position:relative;width:100%;margin-bottom:14px}

/* ── WHITE KEYS ── */
.white-keys{display:flex;width:100%;gap:3px}
.white-key{
  flex:1;height:160px;
  border-radius:0 0 10px 10px;
  cursor:pointer;position:relative;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:10px;
  border:2px solid rgba(0,0,0,.25);
  transition:filter .1s, transform .08s;
  -webkit-tap-highlight-color:transparent;
}
.white-key:active,.white-key.pressed{filter:brightness(0.82);transform:translateY(2px)}
.white-key.highlight{
  animation:keyGlow .7s ease-in-out infinite alternate;
  border-color:rgba(255,255,255,.5)!important;
}
@keyframes keyGlow{0%{filter:brightness(1.1)}100%{filter:brightness(1.35)}}
.white-key.correct-flash{animation:correctFlash .4s ease forwards}
@keyframes correctFlash{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
.white-key.wrong-flash{animation:wrongFlash .35s ease forwards}
@keyframes wrongFlash{0%,40%,80%{filter:brightness(0.6) hue-rotate(180deg)}20%,60%{filter:brightness(1)}}

.key-label{
  font-size:11px;font-weight:900;
  color:rgba(0,0,0,.45);letter-spacing:.5px;
  pointer-events:none;
}

/* ── BLACK KEYS ── */
.black-keys{position:absolute;top:0;left:0;width:100%;height:100px;pointer-events:none}
.black-key{
  position:absolute;
  width:9%;height:95px;
  background:linear-gradient(180deg,#1a1a2e,#0d0d1a);
  border-radius:0 0 7px 7px;
  border:1.5px solid rgba(255,255,255,.08);
  cursor:pointer;pointer-events:all;
  transition:filter .1s, transform .08s;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:6px;z-index:2;
}
.black-key:active,.black-key.pressed{filter:brightness(1.4);transform:translateY(2px)}
.black-key.highlight{
  animation:blackKeyGlow .7s ease-in-out infinite alternate;
  border-color:rgba(255,255,255,.4)!important;
}
@keyframes blackKeyGlow{0%{filter:brightness(1.5)}100%{filter:brightness(2.2)}}
.black-key-label{font-size:8px;font-weight:900;color:rgba(255,255,255,.3);pointer-events:none}

/* ── SONG SELECT ── */
.song-select-wrap{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.song-chip{
  padding:6px 14px;border-radius:50px;font-size:12px;font-weight:900;
  border:1px solid rgba(255,255,255,.1);cursor:pointer;
  font-family:'Nunito',system-ui,sans-serif;
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);
  transition:all .2s;
}
.song-chip.active{background:rgba(168,85,247,.2);color:#C084FC;border-color:rgba(168,85,247,.4)}

/* ── SCORE ── */
.score-row{display:flex;justify-content:center;gap:20px;margin-bottom:8px}
.score-item{text-align:center}
.score-num{font-size:22px;font-weight:900;color:#FBBF24}
.score-lbl{font-size:9px;font-weight:900;color:rgba(255,255,255,.25);letter-spacing:2px;text-transform:uppercase}

/* ── BTN ── */
.restart-btn{display:block;margin:0 auto 12px;padding:8px 24px;border-radius:50px;font-size:13px;font-weight:900;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.1);color:#FBBF24;cursor:pointer;font-family:'Nunito',system-ui,sans-serif;transition:all .2s}
.restart-btn:active{transform:scale(.95)}

/* ── NAV ── */
.app-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(4,4,12,.9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);display:flex;justify-content:space-around;align-items:center;padding:8px 4px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.06);z-index:1000}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:rgba(255,255,255,.28);transition:all .2s;padding:5px 10px;border-radius:12px}
.nav-btn.active,.nav-btn:hover{color:#FBBF24}
.nav-btn.active .nav-icon{transform:scale(1.2)}
.nav-icon{font-size:22px;line-height:1;transition:transform .2s}
.nav-label{font-size:9px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}

/* ── CONFETTI ── */
.cp{position:fixed;top:-10px;pointer-events:none;z-index:9999;border-radius:2px;animation:cf 1.1s ease-in forwards}
@keyframes cf{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<script>window.scrollTo(0,0);if("scrollRestoration"in history)history.scrollRestoration="manual";</script>
<body>

<div class="feedback" id="feedback">✅</div>

<div class="page">

  <header class="header">
    <div class="header-title">🎹 Piano</div>
    <div class="header-sub">Play · Learn · Create</div>
  </header>

  <div class="mode-row">
    <button class="mode-btn active" id="btnLearn" onclick="setMode('learn')">🎵 Learn Song</button>
    <button class="mode-btn" id="btnFree" onclick="setMode('free')">🎹 Free Play</button>
  </div>

  <!-- Song selector -->
  <div class="song-select-wrap" id="songSelect">
    <button class="song-chip active" onclick="selectSong(0)">🟥 Numberblocks Theme</button>
    <button class="song-chip" onclick="selectSong(1)">⭐ Twinkle Twinkle</button>
    <button class="song-chip" onclick="selectSong(2)">🎂 Happy Birthday</button>
  </div>

  <!-- Song progress panel -->
  <div class="song-panel" id="songPanel">
    <div class="song-name">🎵 <span id="songTitle">Numberblocks Theme</span></div>
    <div class="song-progress-track"><div class="song-progress-fill" id="progressFill"></div></div>
    <div class="next-note-wrap" id="nextNoteWrap">
      <span class="next-label">Next</span>
      <div class="next-note-bubble" id="nextBubble" style="--note-color:#EF4444;--note-glow:rgba(239,68,68,.5)">C</div>
      <span class="next-note-name" id="nextNoteName">Play the red key!</span>
    </div>
    <div class="done-msg" id="doneMsg" style="display:none">🌟 Amazing, Cassian! Song complete! 🌟</div>
  </div>

  <div class="score-row" id="scoreRow">
    <div class="score-item"><div class="score-num" id="scoreCorrect">0</div><div class="score-lbl">Correct</div></div>
    <div class="score-item"><div class="score-num" id="scoreStreak">0</div><div class="score-lbl">Streak 🔥</div></div>
    <div class="score-item"><div class="score-num" id="scoreStars">0</div><div class="score-lbl">Stars ⭐</div></div>
  </div>

  <button class="restart-btn" id="restartBtn" onclick="restartSong()">↺ Restart Song</button>

  <!-- Free play label (hidden in learn mode) -->
  <div class="free-label" id="freeLabel" style="display:none">Play any key you like! 🎶</div>

  <!-- Piano keyboard -->
  <div class="piano-wrap" id="pianoWrap">
    <div class="white-keys" id="whiteKeys"></div>
    <div class="black-keys" id="blackKeys"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="app-nav">
  <a href="index.html" class="nav-btn"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
  <a href="numberblocks.html" class="nav-btn"><span class="nav-icon">🔢</span><span class="nav-label">Numbers</span></a>
  <a href="games.html" class="nav-btn"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  <a href="chess.html" class="nav-btn"><span class="nav-icon">♟️</span><span class="nav-label">Chess</span></a>
  <a href="cosmo.html" class="nav-btn"><span class="nav-icon">🤖</span><span class="nav-label">Cosmo</span></a>
</nav>

<script>
// ── Web Audio ──
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, duration = 0.7, vol = 0.45) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const osc2 = ctx.createOscillator();
  const gain2 = ctx.createGain();

  // Two oscillators for richer sound
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + duration);

  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  gain2.gain.setValueAtTime(vol * 0.15, ctx.currentTime);
  gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration * 0.5);
  osc2.connect(gain2); gain2.connect(ctx.destination);
  osc2.start(); osc2.stop(ctx.currentTime + duration * 0.5);
}

function playWrong() {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 120;
  gain.gain.setValueAtTime(0.1, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.25);
}

// ── Note Definitions ──
// Numberblocks colors: each note maps to a Numberblock character
const NOTES = [
  { name:'C', freq:261.63, white:true,  color:'#EF4444', glow:'rgba(239,68,68,.6)',   hint:'red key',    nb:'1' },
  { name:'C#',freq:277.18, white:false, color:'#1a1a2e', glow:'rgba(255,255,255,.3)', hint:'black key',  nb:'' },
  { name:'D', freq:293.66, white:true,  color:'#F97316', glow:'rgba(249,115,22,.6)',  hint:'orange key', nb:'2' },
  { name:'D#',freq:311.13, white:false, color:'#1a1a2e', glow:'rgba(255,255,255,.3)', hint:'black key',  nb:'' },
  { name:'E', freq:329.63, white:true,  color:'#EAB308', glow:'rgba(234,179,8,.6)',   hint:'yellow key', nb:'3' },
  { name:'F', freq:349.23, white:true,  color:'#22C55E', glow:'rgba(34,197,94,.6)',   hint:'green key',  nb:'4' },
  { name:'F#',freq:369.99, white:false, color:'#1a1a2e', glow:'rgba(255,255,255,.3)', hint:'black key',  nb:'' },
  { name:'G', freq:392.00, white:true,  color:'#3B82F6', glow:'rgba(59,130,246,.6)',  hint:'blue key',   nb:'5' },
  { name:'G#',freq:415.30, white:false, color:'#1a1a2e', glow:'rgba(255,255,255,.3)', hint:'black key',  nb:'' },
  { name:'A', freq:440.00, white:true,  color:'#A855F7', glow:'rgba(168,85,247,.6)',  hint:'purple key', nb:'6' },
  { name:'A#',freq:466.16, white:false, color:'#1a1a2e', glow:'rgba(255,255,255,.3)', hint:'black key',  nb:'' },
  { name:'B', freq:493.88, white:true,  color:'#EC4899', glow:'rgba(236,72,153,.6)',  hint:'pink key',   nb:'7' },
  { name:'C5',freq:523.25, white:true,  color:'#EF4444', glow:'rgba(239,68,68,.6)',   hint:'high red key',nb:'8'},
];

// ── Songs ──
const SONGS = [
  {
    title: 'Numberblocks Theme',
    // Simplified original melody in C major
    notes: ['E','G','E','G','A','G','E','D','E','G','E','C5','B','G','E','D','C'],
    hints: ['Yellow!','Blue!','Yellow!','Blue!','Purple!','Blue!','Yellow!','Orange!','Yellow!','Blue!','Yellow!','High Red!','Pink!','Blue!','Yellow!','Orange!','Red — finish!'],
  },
  {
    title: 'Twinkle Twinkle',
    notes: ['C','C','G','G','A','A','G','F','F','E','E','D','D','C','G','G','F','F','E','E','D','G','G','F','F','E','E','D','C','C','G','G','A','A','G','F','F','E','E','D','D','C'],
    hints: [],
  },
  {
    title: 'Happy Birthday',
    notes: ['C','C','D','C','F','E','C','C','D','C','G','F','C','C','C5','A','F','E','D','A#','A#','A','F','G','F'],
    hints: [],
  },
];

// ── State ──
let mode = 'learn';
let currentSong = 0;
let songPos = 0;
let correct = 0;
let streak = 0;
let stars = 0;
let songDone = false;

// ── Build Keyboard ──
function buildKeyboard() {
  const whiteContainer = document.getElementById('whiteKeys');
  const blackContainer = document.getElementById('blackKeys');
  whiteContainer.innerHTML = '';
  blackContainer.innerHTML = '';

  const whiteNotes = NOTES.filter(n => n.white);
  const totalWhite = whiteNotes.length;

  whiteNotes.forEach((note, wi) => {
    const key = document.createElement('div');
    key.className = 'white-key';
    key.id = 'key-' + note.name;
    key.style.background = `linear-gradient(180deg, ${note.color}22 0%, ${note.color}44 60%, ${note.color}66 100%)`;
    key.style.borderColor = note.color + '55';
    key.innerHTML = `<span class="key-label" style="color:${note.color};opacity:0.8">${note.nb || note.name}</span>`;
    key.addEventListener('pointerdown', e => { e.preventDefault(); pressKey(note.name); });
    whiteContainer.appendChild(key);
  });

  // Black keys — position them between white keys
  const blackPositions = {
    'C#': 1, 'D#': 2, 'F#': 4, 'G#': 5, 'A#': 6
  };
  const keyWidthPct = 100 / totalWhite;

  NOTES.filter(n => !n.white).forEach(note => {
    const pos = blackPositions[note.name];
    const key = document.createElement('div');
    key.className = 'black-key';
    key.id = 'key-' + note.name;
    // Center black key between the two white keys it sits between
    const leftPct = (pos * keyWidthPct) - (keyWidthPct * 0.32);
    key.style.left = leftPct + '%';
    key.innerHTML = `<span class="black-key-label">${note.name}</span>`;
    key.addEventListener('pointerdown', e => { e.preventDefault(); pressKey(note.name); });
    blackContainer.appendChild(key);
  });
}

// ── Highlight next key ──
function highlightNext() {
  // Clear all highlights
  NOTES.forEach(n => {
    const el = document.getElementById('key-' + n.name);
    if (el) el.classList.remove('highlight');
  });
  if (mode !== 'learn' || songDone) return;

  const song = SONGS[currentSong];
  if (songPos >= song.notes.length) return;
  const nextName = song.notes[songPos];
  const nextNote = NOTES.find(n => n.name === nextName);
  const el = document.getElementById('key-' + nextName);
  if (el) el.classList.add('highlight');

  // Update bubble
  const bubble = document.getElementById('nextBubble');
  bubble.textContent = nextNote.nb || nextName;
  bubble.style.setProperty('--note-color', nextNote.color);
  bubble.style.setProperty('--note-glow', nextNote.glow);
  bubble.style.background = nextNote.color;

  const hint = song.hints[songPos] || `Play the ${nextNote.hint}!`;
  document.getElementById('nextNoteName').textContent = hint;

  // Progress bar
  const pct = (songPos / song.notes.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ── Key Press ──
function pressKey(noteName) {
  const note = NOTES.find(n => n.name === noteName);
  if (!note) return;
  playTone(note.freq);

  const el = document.getElementById('key-' + noteName);

  if (mode === 'free') {
    if (el) { el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 180); }
    return;
  }

  // Learn mode
  if (songDone) return;
  const song = SONGS[currentSong];
  const expected = song.notes[songPos];

  if (noteName === expected) {
    // Correct!
    correct++;
    streak++;
    if (streak > 0 && streak % 3 === 0) stars++;
    updateScore();

    if (el) {
      el.classList.add('correct-flash');
      setTimeout(() => el.classList.remove('correct-flash'), 400);
    }
    showFeedback(streak >= 3 ? '🔥' : '✅');
    if (streak === 3) miniConfetti();

    songPos++;
    if (songPos >= song.notes.length) {
      finishSong();
    } else {
      highlightNext();
    }
  } else {
    // Wrong
    streak = 0;
    updateScore();
    playWrong();
    if (el) {
      el.classList.add('wrong-flash');
      setTimeout(() => el.classList.remove('wrong-flash'), 350);
    }
    showFeedback('❌');
  }
}

function showFeedback(emoji) {
  const el = document.getElementById('feedback');
  el.textContent = emoji;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 500);
}

function updateScore() {
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreStreak').textContent = streak;
  document.getElementById('scoreStars').textContent = stars;
}

function finishSong() {
  songDone = true;
  NOTES.forEach(n => {
    const el = document.getElementById('key-' + n.name);
    if (el) el.classList.remove('highlight');
  });
  document.getElementById('nextNoteWrap').style.display = 'none';
  document.getElementById('doneMsg').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  bigConfetti();
}

function restartSong() {
  songPos = 0; correct = 0; streak = 0; stars = 0; songDone = false;
  updateScore();
  document.getElementById('nextNoteWrap').style.display = 'flex';
  document.getElementById('doneMsg').style.display = 'none';
  highlightNext();
}

// ── Mode ──
function setMode(m) {
  mode = m;
  document.getElementById('btnLearn').classList.toggle('active', m === 'learn');
  document.getElementById('btnFree').classList.toggle('active', m === 'free');
  document.getElementById('songPanel').style.display = m === 'learn' ? 'block' : 'none';
  document.getElementById('songSelect').style.display = m === 'learn' ? 'flex' : 'none';
  document.getElementById('scoreRow').style.display = m === 'learn' ? 'flex' : 'none';
  document.getElementById('restartBtn').style.display = m === 'learn' ? 'block' : 'none';
  document.getElementById('freeLabel').style.display = m === 'free' ? 'block' : 'none';
  if (m === 'learn') highlightNext();
  else NOTES.forEach(n => { const el = document.getElementById('key-'+n.name); if(el) el.classList.remove('highlight'); });
}

// ── Song select ──
function selectSong(idx) {
  currentSong = idx;
  document.querySelectorAll('.song-chip').forEach((c,i) => c.classList.toggle('active', i === idx));
  document.getElementById('songTitle').textContent = SONGS[idx].title;
  restartSong();
}

// ── Confetti ──
const CC = ['#EF4444','#F97316','#EAB308','#22C55E','#3B82F6','#A855F7','#EC4899','#FBBF24'];
function miniConfetti(n=20) {
  for(let i=0;i<n;i++) setTimeout(()=>{
    const p=document.createElement('div');
    p.className='cp';
    const sz=5+Math.random()*8;
    p.style.cssText=`left:${20+Math.random()*60}%;background:${CC[Math.floor(Math.random()*CC.length)]};width:${sz}px;height:${sz}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${.8+Math.random()*.5}s;animation-delay:${Math.random()*.2}s`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1400);
  },i*25);
}
function bigConfetti() { miniConfetti(60); }

buildKeyboard();
